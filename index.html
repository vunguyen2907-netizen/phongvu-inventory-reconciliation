      ];
      const [accounts, setAccounts] = useState([]);
      const [filter, setFilter] = useState("pending");
      const [aliases, setAliases] = useState({});
      const [loading, setLoading] = useState(true);
      const [busyId, setBusyId] = useState("");
      const [error, setError] = useState("");
      const [message, setMessage] = useState("");
      const [lockTarget, setLockTarget] = useState(null);
      const [lockReason, setLockReason] = useState("");
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [deleteConfirmation, setDeleteConfirmation] = useState("");

      const loadAccounts = async () => {
        setLoading(true);
        setError("");
        try {
          const client = await getReadySupabaseClient();
          if (!client) throw new Error("Chưa cấu hình Supabase Auth.");
          const { data, error } = await client
            .from("profiles")
            .select("id, email, full_name, erp_name, role, status, approved_at, locked_at, deleted_at, created_at")
            .order("created_at", { ascending: true });
          if (error) throw error;
          const manageable = (data || []).filter(account => (
            account.role !== "admin" && (callerRole === "admin" || account.role === "counter")
          ));
          setAccounts(manageable);
          setAliases(previous => ({
            ...Object.fromEntries(manageable.map(account => [account.id, account.erp_name || ""])),
            ...previous
          }));
        } catch (actionError) {
          setError(authErrorMessage(actionError, "Không thể tải danh sách tài khoản."));
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadAccounts(); }, []);

      const runAction = async (account, successMessage, action) => {
        setBusyId(account.id);
        setError("");
        setMessage("");
        try {
          const client = await getReadySupabaseClient();
          if (!client) throw new Error("Chưa cấu hình Supabase Auth.");
          await action(client);
          setMessage(successMessage);
          await loadAccounts();
          return true;
        } catch (actionError) {
          setError(authErrorMessage(actionError, "Không thể cập nhật tài khoản."));
          return false;
        } finally {
          setBusyId("");
        }
      };

      const approve = async account => {
        const erpName = String(aliases[account.id] || "").trim();
        if (!erpName) {
          setError("Tên nhân viên ERP không được để trống.");
          return;
        }
        await runAction(account, `Đã phê duyệt ${account.full_name}.`, async client => {
          await invokeLifecycle(client, "approve_user", account, { erp_name: erpName });
        });
      };

      const confirmLock = async () => {
        const reason = lockReason.trim();
        if (!lockTarget || !reason) return;
        const succeeded = await runAction(lockTarget, `Đã khóa ${lockTarget.full_name}.`, async client => {
          const { error } = await client.rpc("manager_lock_profile", {
            p_user_id: lockTarget.id,
            p_reason: reason
          });
          if (error) throw error;
        });
        if (succeeded) {
          setLockTarget(null);
          setLockReason("");
        }
      };

      const invokeLifecycle = async (client, action, account, extra = {}) => {
        const { data, error } = await client.functions.invoke("admin-user-lifecycle", {
          body: { action, target_user_id: account.id, ...extra }
        });
        if (error) {
          let detail = "";
          try {
            const response = error.context;
            const body = response && typeof response.json === "function" ? await response.json() : null;
            detail = body?.message || body?.error || "";
          } catch (_parseError) {
            // Keep the SDK error when the Edge Function response is not JSON.
          }
          throw new Error(detail || error.message || "Yêu cầu vòng đời tài khoản thất bại.");
        }
        if (!data?.ok) throw new Error(data?.error || "Yêu cầu vòng đời tài khoản thất bại.");
      };

      const unlock = async account => {
        await runAction(account, `Đã mở khóa ${account.full_name}.`, client => invokeLifecycle(client, "unlock_user", account));
      };

      const confirmEmail = async account => {
        await runAction(account, `Đã xác nhận email đăng nhập cho ${account.full_name}.`, client => invokeLifecycle(client, "confirm_email", account));
      };

      const confirmDelete = async () => {
        if (!deleteTarget || deleteConfirmation.trim().toLowerCase() !== deleteTarget.email.toLowerCase()) return;
        const succeeded = await runAction(deleteTarget, `Đã xóa quyền đăng nhập của ${deleteTarget.full_name}.`, client => (
          invokeLifecycle(client, "delete_user", deleteTarget)
        ));
        if (succeeded) {
          setDeleteTarget(null);
          setDeleteConfirmation("");
        }
      };

      const visibleAccounts = accounts.filter(account => account.status === filter);

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/60 flex justify-end" role="dialog" aria-modal="true" aria-labelledby="account-management-title">
          <section className="h-full w-full max-w-4xl bg-slate-50 shadow-2xl flex flex-col">
            <header className="bg-white border-b border-slate-200 px-6 py-5 flex items-start justify-between gap-4">
              <div>
                <h2 id="account-management-title" className="text-xl font-extrabold text-slate-900">Quản lý tài khoản</h2>
                <p className="mt-1 text-sm text-slate-500">Phê duyệt và vô hiệu hóa tài khoản kiểm đếm. Lịch sử đã hoàn tất luôn được giữ lại.</p>
              </div>
              <button type="button" onClick={onClose} aria-label="Đóng quản lý tài khoản" className="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">×</button>
            </header>

            <div className="px-6 pt-5">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2" role="group" aria-label="Lọc trạng thái tài khoản">
                {filters.map(item => (
                  <button key={item.id} type="button" aria-label={item.label} onClick={() => setFilter(item.id)} className={`rounded-xl border px-3 py-2.5 text-sm font-bold ${filter === item.id ? 'border-brand-600 bg-brand-600 text-white' : 'border-slate-200 bg-white text-slate-600 hover:border-brand-300'}`}>
                    {item.label} <span className="ml-1 opacity-75">{accounts.filter(account => account.status === item.id).length}</span>
                  </button>
                ))}
              </div>
              {error && <p role="alert" className="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700">{error}</p>}
              {message && <p role="status" className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700">{message}</p>}
            </div>

            <div className="flex-1 overflow-y-auto p-6">
              {loading ? (
                <p className="text-sm text-slate-500">Đang tải tài khoản…</p>
              ) : visibleAccounts.length === 0 ? (
                <div className="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-500">Không có tài khoản trong nhóm này.</div>
              ) : (
                <div className="space-y-3">
                  {visibleAccounts.map(account => (
                    <article key={account.id} className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                      <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                        <div className="min-w-0">
                          <h3 className="font-bold text-slate-900">{account.full_name}</h3>
                          <p className="text-sm text-slate-500 break-all">{account.email}</p>
                          <p className="mt-1 text-xs text-slate-400">{account.role} · {account.erp_name || "Chưa có ERP"}</p>
                        </div>
                        {account.status === "pending" && (
                          <div className="flex flex-col sm:flex-row gap-2 sm:items-end">
                            <label className="text-xs font-bold text-slate-600">
                              Tên nhân viên ERP
                              <input aria-label={`ERP cho ${account.full_name}`} value={aliases[account.id] || ""} onChange={event => setAliases(previous => ({ ...previous, [account.id]: event.target.value }))} className="mt-1 block w-full sm:w-56 rounded-lg border border-slate-300 px-3 py-2 text-sm font-normal" />
                            </label>
                            <button type="button" aria-label={`Phê duyệt ${account.full_name}`} onClick={() => approve(account)} disabled={busyId === account.id} className="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-bold text-white disabled:opacity-50">Phê duyệt</button>
                            <button type="button" aria-label={`Xóa ${account.full_name}`} onClick={() => { setDeleteTarget(account); setDeleteConfirmation(""); }} className="rounded-lg bg-rose-600 px-4 py-2 text-sm font-bold text-white">Xóa</button>
                          </div>
                        )}
                        {account.status === "active" && (
                          <div className="flex gap-2">
                            <button type="button" aria-label={`Xác nhận email ${account.full_name}`} onClick={() => confirmEmail(account)} disabled={busyId === account.id} className="rounded-lg bg-sky-600 px-4 py-2 text-sm font-bold text-white disabled:opacity-50">Xác nhận email</button>
                            <button type="button" aria-label={`Khóa ${account.full_name}`} onClick={() => { setLockTarget(account); setLockReason(""); }} className="rounded-lg bg-amber-500 px-4 py-2 text-sm font-bold text-white">Khóa</button>
                            <button type="button" aria-label={`Xóa ${account.full_name}`} onClick={() => { setDeleteTarget(account); setDeleteConfirmation(""); }} className="rounded-lg bg-rose-600 px-4 py-2 text-sm font-bold text-white">Xóa</button>
                          </div>
                        )}
                        {account.status === "locked" && (
                          <div className="flex gap-2">
                            <button type="button" aria-label={`Mở khóa ${account.full_name}`} onClick={() => unlock(account)} disabled={busyId === account.id} className="rounded-lg bg-brand-600 px-4 py-2 text-sm font-bold text-white disabled:opacity-50">Mở khóa</button>
                            <button type="button" aria-label={`Xóa ${account.full_name}`} onClick={() => { setDeleteTarget(account); setDeleteConfirmation(""); }} className="rounded-lg bg-rose-600 px-4 py-2 text-sm font-bold text-white">Xóa</button>
                          </div>
                        )}
                        {account.status === "deleted" && <span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-500">Đã vô hiệu hóa</span>}
                      </div>
                    </article>
                  ))}
                </div>
              )}
            </div>
          </section>

          {lockTarget && (
            <div className="fixed inset-0 z-[60] bg-slate-950/50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="lock-account-title">
              <div className="w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
                <h3 id="lock-account-title" className="text-lg font-extrabold text-slate-900">Khóa tài khoản</h3>
                <p className="mt-1 text-sm text-slate-500">Công việc chưa hoàn tất của {lockTarget.full_name} sẽ trở về trạng thái chưa phân công.</p>
                <label className="mt-4 block text-sm font-bold text-slate-700">Lý do khóa
                  <textarea aria-label="Lý do khóa" rows="3" value={lockReason} onChange={event => setLockReason(event.target.value)} className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal" />
                </label>
                <div className="mt-4 flex justify-end gap-2">
                  <button type="button" onClick={() => setLockTarget(null)} className="rounded-lg bg-slate-100 px-4 py-2 text-sm font-bold text-slate-700">Hủy</button>
                  <button type="button" onClick={confirmLock} disabled={!lockReason.trim() || busyId === lockTarget.id} className="rounded-lg bg-amber-500 px-4 py-2 text-sm font-bold text-white disabled:opacity-50">Xác nhận khóa</button>
                </div>
              </div>
            </div>
          )}

          {deleteTarget && (
            <div className="fixed inset-0 z-[60] bg-slate-950/50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="delete-account-title">
              <div className="w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
                <h3 id="delete-account-title" className="text-lg font-extrabold text-rose-700">Xóa quyền đăng nhập</h3>
                <p className="mt-2 text-sm text-slate-600">Nhập <strong>{deleteTarget.email}</strong> để xác nhận. Hồ sơ và lịch sử kiểm đếm không bị xóa vật lý.</p>
                <label className="mt-4 block text-sm font-bold text-slate-700">Nhập email để xác nhận
                  <input aria-label="Nhập email để xác nhận" value={deleteConfirmation} onChange={event => setDeleteConfirmation(event.target.value)} className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal" />
                </label>
                <div className="mt-4 flex justify-end gap-2">
                  <button type="button" onClick={() => setDeleteTarget(null)} className="rounded-lg bg-slate-100 px-4 py-2 text-sm font-bold text-slate-700">Hủy</button>
                  <button type="button" onClick={confirmDelete} disabled={deleteConfirmation.trim().toLowerCase() !== deleteTarget.email.toLowerCase() || busyId === deleteTarget.id} className="rounded-lg bg-rose-600 px-4 py-2 text-sm font-bold text-white disabled:opacity-50">Xác nhận xóa</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MAIN REACT SPA COMPONENT ---
    function ApplicationShell({ session, profile, legacyMode = false }) {
      const isManager = legacyMode || profile?.role === "manager" || profile?.role === "admin";
      const allowedTabs = isManager ? MANAGER_TABS : COUNTER_TABS;
      const [activeTab, setActiveTab] = useState(() => isManager ? "import" : "second-count");
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [sessionName, setSessionName] = useState(`Kiểm kê ${new Date().toLocaleDateString('vi-VN')}`);
      const [activeSessionId, setActiveSessionId] = useState(null);
      const [lastSavedTime, setLastSavedTime] = useState(null);
      const [isDirty, setIsDirty] = useState(false);
      const [savedSessions, setSavedSessions] = useState([]);
      const [monthlyArchives, setMonthlyArchives] = useState([]);
      const [authActionError, setAuthActionError] = useState("");
      const [authActionMessage, setAuthActionMessage] = useState("");
      const [authActionPending, setAuthActionPending] = useState(false);
      const [accountPanelOpen, setAccountPanelOpen] = useState(false);

      // Raw Uploaded Files States
      const [rawStockData, setRawStockData] = useState([]);
      const [rawStockFileName, setRawStockFileName] = useState("");
      const [rawErpData, setRawErpData] = useState([]);
      const [rawErpFileName, setRawErpFileName] = useState("");

      // Processed Data States
      const [dfCountL2, setDfCountL2] = useState([]);
      const [dfCheckDetail, setDfCheckDetail] = useState([]);

      // Secure second-count manager workspace. The legacy SKU recount table is
      // retained as a fallback until a manager creates the normalized batch.
      const [recountBatch, setRecountBatch] = useState(null);
      const [recountTasks, setRecountTasks] = useState([]);
      const [recountCounters, setRecountCounters] = useState([]);
      const [recountPage, setRecountPage] = useState(1);
      const [recountLoading, setRecountLoading] = useState(false);
      const [recountCountersLoading, setRecountCountersLoading] = useState(false);
      const [counterRecountTasks, setCounterRecountTasks] = useState([]);
      const [counterRecountLoading, setCounterRecountLoading] = useState(false);
      const [recountSelectedIds, setRecountSelectedIds] = useState([]);
      const [recountAssignee, setRecountAssignee] = useState("");
      const [recountFilters, setRecountFilters] = useState({ assignee: "", state: "", taskType: "", sku: "", bin: "" });
      const [recountSummary, setRecountSummary] = useState({ total: 0, unassigned: 0, assigned: 0, in_progress: 0, completed: 0 });
      const [recountReopenTarget, setRecountReopenTarget] = useState(null);
      const [recountReopenReason, setRecountReopenReason] = useState("");
      const [recountReopenConfirmation, setRecountReopenConfirmation] = useState("");

      // Export Metadata State
      const [reportDate, setReportDate] = useState(new Date().toISOString().slice(0, 10));
      const [locationName, setLocationName] = useState("CP74 - KHÁNH HỘI | Địa chỉ: 162 - 164 Khánh Hội, Phường Khánh Hội, TPHCM");
      const [mgrName, setMgrName] = useState("Nguyễn Tuấn Vũ");
      const [staffName, setStaffName] = useState("Nguyễn Xuân Lộc");

      // Modal State for Removing Surplus / Wrong Serial
      const [pendingClearSerial, setPendingClearSerial] = useState(null);
      const [clearReasonInput, setClearReasonInput] = useState("");

      // Explanation report modal
      const [explanationModalOpen, setExplanationModalOpen] = useState(false);
      const [proposedActions, setProposedActions] = useState({});

      // Monthly Archive Form
      const [archiveMonth, setArchiveMonth] = useState(new Date().getMonth() + 1);
      const [archiveYear, setArchiveYear] = useState(new Date().getFullYear());
      const [archiveLabel, setArchiveLabel] = useState("");

      // Filters
      const [filterDetailStatus, setFilterDetailStatus] = useState("Chỉ Serial chênh lệch (Dư / Thiếu)");
      const [searchDetail, setSearchDetail] = useState("");

      const [filterL2Mode, setFilterL2Mode] = useState("Chỉ SKU chênh lệch (Cần xử lý)");
      const [filterL2Status, setFilterL2Status] = useState("Tất cả");
      const [searchL2, setSearchL2] = useState("");

      const [filterMainMode, setFilterMainMode] = useState("Chỉ SKU chênh lệch / Sai lý do (Cần xử lý)");
      const [filterMainStatus, setFilterMainStatus] = useState("Tất cả");
      const [searchMain, setSearchMain] = useState("");
      const [sortDetail, setSortDetail] = useState({ key: null, direction: "asc" });
      const [sortL2, setSortL2] = useState({ key: null, direction: "asc" });
      const [sortMain, setSortMain] = useState({ key: null, direction: "asc" });
      const [wrapDetailText, setWrapDetailText] = useState(false);
      const [wrapL2Text, setWrapL2Text] = useState(false);
      const [wrapMainText, setWrapMainText] = useState(false);

      useEffect(() => {
        setActiveTab(currentTab => (
          allowedTabs.some(tab => tab.id === currentTab) ? currentTab : allowedTabs[0].id
        ));
      }, [profile?.role, legacyMode]);

      const toggleSort = (setter) => (key) => {
        setter(prev => ({
          key,
          direction: prev.key === key && prev.direction === "asc" ? "desc" : "asc"
        }));
      };

      // Supabase fetch
      const fetchSavedSessions = async () => {
        if (!isManager || !supabaseClient) return;
        try {
          const client = await getReadySupabaseClient();
          if (!client) return;
          const { data, error } = await client
            .from('inventory_sessions')
            .select('id, session_name, created_at, updated_at')
            .order('updated_at', { ascending: false });
          if (!error && data) setSavedSessions(data);
        } catch (e) { console.error(e); }
      };

      const fetchMonthlyArchives = async () => {
        if (!isManager || !supabaseClient) return;
        try {
          const client = await getReadySupabaseClient();
          if (!client) return;
          const { data, error } = await client
            .from('monthly_archives')
            .select('id, year_month, session_name, created_at, updated_at')
            .order('year_month', { ascending: false });
          if (!error && data) {
            const formatted = data.map(r => {
              const [y, m] = r.year_month.split('-');
              return { ...r, label: r.session_name || `Tháng ${m}/${y}` };
            });
            setMonthlyArchives(formatted);
          }
        } catch (e) { console.error(e); }
      };

      useEffect(() => {
        if (!isManager) return;
        fetchSavedSessions();
        fetchMonthlyArchives();
        fetchRecountCounters();
      }, [isManager]);

      useEffect(() => {
        if (isManager && activeTab === "second-count") fetchRecountCounters();
      }, [isManager, activeTab]);

      const fetchRecountCounters = async () => {
        if (!isManager || !supabaseClient) return;
        setRecountCountersLoading(true);
        try {
          const client = await getReadySupabaseClient();
          if (!client) return;
          const { data, error } = await client
            .from('profiles')
            .select('id, full_name, erp_name, status, role')
            .eq('role', 'counter')
            .order('full_name');
          if (!error && data) setRecountCounters(data);
        } catch (e) { console.error(e); }
        finally { setRecountCountersLoading(false); }
      };

      // Counters may only read their own assigned rows. RLS enforces that
      // boundary and masked_reference prevents the exact serial from leaking.
      const fetchCounterRecountTasks = async () => {
        if (isManager || !supabaseClient || !session?.user?.id) return;
        setCounterRecountLoading(true);
        try {
          const client = await getReadySupabaseClient();
          if (!client) return;
          const { data, error } = await client
            .from('recount_tasks')
            .select('id, batch_id, sku, product_name, stock_bin, first_count_bin, first_count_status, first_counter_name_snapshot, task_type, masked_reference, state, resolution, reason, updated_at')
            .eq('assigned_user_id', session.user.id)
            .order('updated_at', { ascending: false });
          if (error) throw error;
          setCounterRecountTasks(Array.isArray(data) ? data : []);
        } catch (e) {
          console.error('Không thể tải danh sách kiểm lần 2 của counter:', e);
          setCounterRecountTasks([]);
        } finally {
          setCounterRecountLoading(false);
        }
      };

      useEffect(() => {
        if (!isManager && activeTab === "second-count") fetchCounterRecountTasks();
      }, [isManager, activeTab, session?.user?.id]);

      const recountRpcFilters = () => ({
        p_assignee_id: recountFilters.assignee || null,
        p_state: recountFilters.state || null,
        p_task_type: recountFilters.taskType || null,
        p_sku: recountFilters.sku.trim() || null,
        p_bin: recountFilters.bin.trim() || null
      });

      const fetchRecountTasks = async (page = recountPage, batchId = recountBatch?.batch_id) => {
        if (!isManager || !supabaseClient || !batchId) return;
        setRecountLoading(true);
        try {
          const client = await getReadySupabaseClient();
          if (!client) return;
          const { data, error } = await client.rpc('manager_list_recount_tasks', {
            p_batch_id: batchId,
            p_page: page,
            p_page_size: 100,
            ...recountRpcFilters()
          });
          if (error) throw error;
          setRecountTasks(Array.isArray(data) ? data : []);
          setRecountPage(page);
          setRecountSelectedIds([]);
        } catch (e) { alert('Lỗi tải danh sách kiểm lần 2: ' + e.message); }
        finally { setRecountLoading(false); }
      };

      const refreshRecountSummary = async (batchId = recountBatch?.batch_id) => {
        if (!isManager || !supabaseClient || !batchId) return;
        try {
          const client = await getReadySupabaseClient();
          if (!client) return;
          const countRows = async (state = null) => {
            let query = client.from('recount_tasks').select('id', { count: 'exact', head: true }).eq('batch_id', batchId);
            if (state) query = query.eq('state', state);
            const { count, error } = await query;
            if (error) throw error;
            return count || 0;
          };
          const [total, unassigned, assigned, inProgress, completed] = await Promise.all([
            countRows(), countRows('unassigned'), countRows('assigned'), countRows('in_progress'), countRows('completed')
          ]);
          setRecountSummary({ total, unassigned, assigned, in_progress: inProgress, completed });
        } catch (e) { console.error('Không thể tải tổng quan kiểm lần 2:', e); }
      };

      const handleCreateRecountBatch = async () => {
        if (recountLoading) return;
        if (!supabaseClient || !activeSessionId || dfCheckDetail.length === 0) {
          alert('Vui lòng lưu đợt kiểm kê lên Supabase trước khi tạo danh sách kiểm lần 2.');
          return;
        }
        setRecountLoading(true);
        try {
          const client = await getReadySupabaseClient();
          if (!client) throw new Error('Chưa cấu hình Supabase.');
          const profileRows = recountCounters.filter(counter => counter.status === 'active');
          const domain = window.InventoryRecountDomain;
          if (!domain?.buildRecountDraft) throw new Error('Chưa tải mô-đun kiểm đếm an toàn.');
          const draft = domain.buildRecountDraft(dfCheckDetail, profileRows);
          const { data, error } = await client.rpc('manager_create_recount_batch', {
            p_inventory_session_id: activeSessionId,
            p_tasks: draft.tasks,
            p_evidence: draft.evidence
          });
          if (error) throw error;
          const summary = data && typeof data === 'object' ? data : {};
          setRecountBatch(summary);
          setRecountPage(1);
          await fetchRecountTasks(1, summary.batch_id);
          await refreshRecountSummary(summary.batch_id);
          alert(`✅ Đã tạo danh sách kiểm lần 2 (${summary.task_count || draft.tasks.length} task).`);
        } catch (e) { alert('Lỗi tạo danh sách kiểm lần 2: ' + e.message); }
        finally { setRecountLoading(false); }
      };

      const handleBulkAssignRecount = async () => {
        if (!recountBatch?.batch_id || !recountAssignee || recountSelectedIds.length === 0) return;
        setRecountLoading(true);
        try {
          const client = await getReadySupabaseClient();
          for (let start = 0; start < recountSelectedIds.length; start += 500) {
            const chunk = recountSelectedIds.slice(start, start + 500);
            const { error } = await client.rpc('manager_bulk_assign_recount_tasks', {
              p_task_ids: chunk,
              p_user_id: recountAssignee
            });
            if (error) throw error;
          }
          await fetchRecountTasks(recountPage);
          await refreshRecountSummary();
          setRecountAssignee("");
          alert('✅ Đã phân công các dòng đã chọn.');
        } catch (e) { alert('Lỗi phân công kiểm lần 2: ' + e.message); }
        finally { setRecountLoading(false); }
      };

      const confirmReopenRecount = async () => {
        if (
          !recountReopenTarget ||
          recountReopenTarget.state !== 'completed' ||
          recountReopenConfirmation !== 'MO LAI' ||
          !recountReopenReason.trim() ||
          recountLoading
        ) return;
        setRecountLoading(true);
        try {
          const client = await getReadySupabaseClient();
          const { error } = await client.rpc('manager_reopen_recount_tasks', {
            p_task_ids: [recountReopenTarget.id],
            p_reason: recountReopenReason
          });
          if (error) throw error;
          setRecountReopenTarget(null);
          setRecountReopenReason("");
          setRecountReopenConfirmation("");
          await fetchRecountTasks(recountPage);
          await refreshRecountSummary();
        } catch (e) { alert('Lỗi mở lại task: ' + e.message); }
        finally { setRecountLoading(false); }
      };

      useEffect(() => {
        if (!recountBatch?.batch_id || activeTab !== 'second-count') return;
        fetchRecountTasks(1);
        refreshRecountSummary();
      }, [recountBatch?.batch_id, recountFilters, activeTab]);

      // Auto-save debounce (10s)
      useEffect(() => {
        if (!isManager || !isDirty || !supabaseClient || dfCheckDetail.length === 0) return;
        const timer = setTimeout(() => {
          handleSaveSession(false);
        }, 10000);
        return () => clearTimeout(timer);
      }, [isManager, isDirty, dfCheckDetail, dfCountL2]);

      // Serial được bổ sung tại tab Chi tiết là số đếm Lần 2 của SKU tương ứng.
      useEffect(() => {
        if (dfCheckDetail.length === 0) return;
        setDfCountL2(prev => syncCountsWithDetail(prev, dfCheckDetail));
      }, [dfCheckDetail]);

      // --- RECONCILIATION ALGORITHM ---
      const handleProcessFiles = (stockRowsRaw, erpRowsRaw) => {
        if (!stockRowsRaw || stockRowsRaw.length === 0 || !erpRowsRaw || erpRowsRaw.length === 0) {
          alert("Vui lòng tải lên cả 2 file trước khi bấm đối soát!");
          return;
        }

        const stockRows = stockRowsRaw.map(r => {
          const sku = normalizeSku(findVal(r, skuCandidates));
          const name = findVal(r, nameCandidates, "Chưa có tên");
          const serial = findVal(r, serialCandidates, "", ['loại serial', 'loại hàng']);
          const qty = parseQuantity(findVal(r, qtyCandidates, "1"), 1);
          const bin = findVal(r, binCandidates);
          const uom = findVal(r, uomCandidates, "Cái");
          const type = findVal(r, typeCandidates, "Hàng bán");
          return { sku, name, serial, qty, bin, uom, type };
        }).filter(r => r.sku);

        // Keep metadata from every KetQuaChiTiet row, including quantity 0 placeholders.
        const erpSourceRows = erpRowsRaw.map(r => {
          const sku = normalizeSku(findVal(r, skuCandidates));
          const serial = findVal(r, serialCandidates, "", ['loại serial', 'loại hàng']);
          const bin = findVal(r, binCandidates);
          const qtyValStr = findVal(r, qtyCandidates, "1");
          const qty = parseQuantity(qtyValStr, 0);
          const performedBy = findVal(r, performerCandidates, "");
          const inventoryTime = formatInventoryTime(findVal(r, inventoryTimeCandidates, ""));
          return { sku, serial, bin, qty, performedBy, inventoryTime };
        }).filter(r => r.sku);

        // Only positive quantities take part in reconciliation, but all rows remain
        // available above for showing executor metadata by Serial/LOT.
        const erpRows = erpSourceRows.filter(r => r.qty > 0);
        const executionMetadataIndex = buildExecutionMetadataIndex(erpSourceRows);

        if (stockRows.length === 0 || erpRows.length === 0) {
          alert("Không khớp được cột SKU/Mã sản phẩm trên 2 file. Vui lòng kiểm tra lại file!");
          return;
        }

        const erpItemsBySku = {};
        const erpMetadataBySku = {};
        const erpQtyBySku = {};
        const serialSkusSet = new Set();

        erpRows.forEach(r => {
          if (!erpQtyBySku[r.sku]) erpQtyBySku[r.sku] = 0;
          erpQtyBySku[r.sku] += r.qty;
          if (!erpMetadataBySku[r.sku]) erpMetadataBySku[r.sku] = [];
          erpMetadataBySku[r.sku].push(r);
          if (r.serial) {
            serialSkusSet.add(r.sku);
            if (!erpItemsBySku[r.sku]) erpItemsBySku[r.sku] = [];
            erpItemsBySku[r.sku].push({
              serial: r.serial,
              bin: r.bin,
              performedBy: r.performedBy,
              inventoryTime: r.inventoryTime
            });
          }
        });

        const getSkuExecutionMetadata = sku => summarizeExecutionMetadata(erpMetadataBySku[sku] || []);

        stockRows.forEach(r => {
          if (r.serial) serialSkusSet.add(r.sku);
        });

        const stockQtyBySku = {};
        const stockNameBySku = {};
        const stockUomBySku = {};

        stockRows.forEach(r => {
          if (!stockQtyBySku[r.sku]) {
            stockQtyBySku[r.sku] = 0;
            stockNameBySku[r.sku] = r.name;
            stockUomBySku[r.sku] = r.uom;
          }
          stockQtyBySku[r.sku] += r.qty;
        });

        const allSkus = Array.from(new Set([...Object.keys(stockQtyBySku), ...Object.keys(erpQtyBySku)]));

        const countL2Data = allSkus.map(sku => {
          const name = stockNameBySku[sku] || "Sản phẩm mới chưa có trong danh mục";
          const uom = stockUomBySku[sku] || "Cái";
          const qtySys = stockQtyBySku[sku] || 0;
          let qtyL1 = 0;
          if (serialSkusSet.has(sku)) {
            qtyL1 = (erpItemsBySku[sku] || []).length;
          } else {
            qtyL1 = erpQtyBySku[sku] || 0;
          }
          return {
            sku,
            name,
            uom,
            qtySys,
            qtyL1,
            qtyL2: 0,
            diffL2: qtyL1 - qtySys,
            totalActual: qtyL1,
            note: ""
          };
        });

        const detailRows = [];
        const stockRowsBySku = {};

        stockRows.forEach(r => {
          if (!stockRowsBySku[r.sku]) stockRowsBySku[r.sku] = [];
          const isNonSerial = !serialSkusSet.has(r.sku);
          stockRowsBySku[r.sku].push({
            sku: r.sku,
            name: r.name,
            uom: r.uom,
            qty: isNonSerial ? r.qty : 1,
            stockSerial: isNonSerial ? "(Hàng không serial)" : r.serial,
            scannedSerial: "",
            bin: r.bin,
            type: isNonSerial ? "Hàng không serial" : r.type,
            performedBy: "",
            inventoryTime: "",
            checked: 0,
            diff: -(isNonSerial ? r.qty : 1),
            status: "Bắn thiếu (Chưa quét)",
            note: "",
            isNonSerial
          });
        });

        allSkus.forEach(sku => {
          const sRows = stockRowsBySku[sku] || [];
          const isSerial = serialSkusSet.has(sku);

          if (!isSerial) {
            const totalErp = erpQtyBySku[sku] || 0;
            const executionMetadata = getSkuExecutionMetadata(sku);
            let remErp = totalErp;
            sRows.forEach((r, idx) => {
              const sysQ = r.qty;
              let alloc = remErp >= sysQ ? sysQ : remErp;
              remErp -= alloc;
              if (idx === sRows.length - 1 && remErp > 0) {
                alloc += remErp;
                remErp = 0;
              }
              const diffQ = alloc - sysQ;
              detailRows.push({
                ...r,
                scannedSerial: alloc > 0 ? `${alloc} cái` : "0 cái",
                ...executionMetadata,
                checked: alloc,
                diff: diffQ,
                status: diffQ === 0 ? `Đã đếm đủ (${alloc}/${sysQ})` : (diffQ < 0 ? `Bắn thiếu ${Math.abs(diffQ)} hàng (${alloc}/${sysQ})` : `Bắn thừa ${diffQ} hàng (${alloc}/${sysQ})`)
              });
            });
            if (sRows.length === 0 && totalErp > 0) {
              detailRows.push({
                sku, name: "Sản phẩm không serial chưa có trong danh mục", uom: "Cái", qty: 0,
                stockSerial: "(Hàng không serial)", scannedSerial: `Đã đếm: ${totalErp}`, bin: "",
                type: "Không có tồn hệ thống", ...executionMetadata,
                checked: totalErp, diff: totalErp, status: `Bắn thừa hàng ${totalErp}`, note: ""
              });
            }
          } else {
            const eItems = [...(erpItemsBySku[sku] || [])];
            const matchedSerialsSet = new Set();
            
            // 1. Exact match by serial number
            sRows.forEach(r => {
              const stockSerialKey = normalizeExecutionMetadataKey(r.stockSerial);
              const matchedIdx = eItems.findIndex(e => normalizeExecutionMetadataKey(e.serial) === stockSerialKey);
              if (r.stockSerial && matchedIdx !== -1) {
                const matched = eItems.splice(matchedIdx, 1)[0];
                r.scannedSerial = matched.serial;
                r.bin = matched.bin || r.bin;
                r.performedBy = matched.performedBy || "";
                r.inventoryTime = matched.inventoryTime || "";
                r.checked = 1;
                r.diff = 0;
                r.status = "Đã quét đủ";
                matchedSerialsSet.add(matched.serial);
              }
            });

            // 2. Unmatched stock rows paired with unmatched scanned serials -> Bắn sai serial!
            sRows.forEach(r => {
              if (r.checked === 0) {
                if (eItems.length > 0) {
                  const wrongItem = eItems.shift();
                  r.scannedSerial = wrongItem.serial;
                  r.bin = wrongItem.bin || r.bin;
                  r.performedBy = wrongItem.performedBy || "";
                  r.inventoryTime = wrongItem.inventoryTime || "";
                  r.checked = 1;
                  r.diff = 0;
                  r.status = "Bắn sai serial";
                } else {
                  r.scannedSerial = "";
                  r.checked = 0;
                  r.diff = -1;
                  r.status = "Bắn thiếu (Chưa quét)";
                }
              }
              detailRows.push(r);
            });

            // 3. Extra scanned serials -> Bắn dư serial
            if (eItems.length > 0) {
              const firstName = sRows.length > 0 ? sRows[0].name : "Sản phẩm quét dư / chưa có trong danh mục";
              const firstUom = sRows.length > 0 ? sRows[0].uom : "Cái";
              eItems.forEach(extraItem => {
                const isDupScan = matchedSerialsSet.has(extraItem.serial);
                const statusStr = isDupScan ? "Bắn dư (Quét trùng Serial)" : "Bắn dư serial";
                const noteStr = isDupScan ? `[Quét trùng Serial ${extraItem.serial} đã kiểm ở Bin khác]` : "";

                detailRows.push({
                  sku, name: firstName, uom: firstUom, qty: 1, stockSerial: "", scannedSerial: extraItem.serial, bin: extraItem.bin || "",
                  type: sRows.length > 0 ? "Bắn dư serial" : "Không có tồn hệ thống",
                  performedBy: extraItem.performedBy || "", inventoryTime: extraItem.inventoryTime || "",
                  checked: 1, diff: 1, status: statusStr, note: noteStr
                });
              });
            }
          }
        });

        const enrichedDetailRows = detailRows.map((row, index) => {
          const sourceMetadata = resolveExecutionMetadata(executionMetadataIndex, row);
          return {
            ...row,
            performedBy: row.performedBy || sourceMetadata.performedBy,
            inventoryTime: row.inventoryTime || sourceMetadata.inventoryTime,
            rowId: `${row.sku}::${index}`
          };
        });

        setDfCountL2(countL2Data);
        setDfCheckDetail(enrichedDetailRows);
        setIsDirty(true);
        setActiveTab("serial-detail");
      };

      // --- SAVE & LOAD SESSIONS ---
      const handleSaveSession = async (showNotice = true) => {
        if (!supabaseClient || dfCheckDetail.length === 0) return;
        try {
          const client = await getReadySupabaseClient();
          if (!client) throw new Error("Không thể xác thực Supabase.");
          const payload = {
            df_count_l2: dfCountL2,
            df_check_detail: dfCheckDetail,
          };
          const rowData = {
            session_name: sessionName.trim() || "Đợt kiểm kê chưa đặt tên",
            data: payload
          };
          if (activeSessionId) rowData.id = activeSessionId;

          const { data, error } = await client
            .from('inventory_sessions')
            .upsert(rowData)
            .select();

          if (error) throw error;
          if (!error && data && data.length > 0) {
            setActiveSessionId(data[0].id);
            setLastSavedTime(new Date().toLocaleTimeString('vi-VN'));
            setIsDirty(false);
            fetchSavedSessions();
            if (showNotice) alert("✅ Đã lưu thành công đợt kiểm kê lên Supabase!");
          }
        } catch (e) { alert("Lỗi khi lưu Supabase: " + e.message); }
      };

      const handleLoadSession = async (id) => {
        if (!supabaseClient) return;
        try {
          const client = await getReadySupabaseClient();
          if (!client) throw new Error("Không thể xác thực Supabase.");
          const { data, error } = await client
            .from('inventory_sessions')
            .select('*')
            .eq('id', id)
            .single();

          if (error) throw error;
          if (!error && data) {
            const p = data.data || {};
            const [countRows, detailRows] = await Promise.all([
              decodeStoredRows(p.df_count_l2),
              decodeStoredRows(p.df_check_detail)
            ]);
            const loadedDetails = normalizeDetailRows(detailRows);
            setDfCountL2(syncCountsWithDetail(countRows.map(adaptLegacyCountRow), loadedDetails));
            setDfCheckDetail(loadedDetails);
            setActiveSessionId(data.id);
            setSessionName(data.session_name || '');
            setLastSavedTime(new Date(data.updated_at).toLocaleTimeString('vi-VN'));
            setIsDirty(false);
          }
        } catch (e) { alert("Lỗi tải đợt kiểm kê: " + e.message); }
      };

      // --- MONTHLY ARCHIVE SAVE ---
      const handleSaveMonthlyArchive = async () => {
        if (!supabaseClient || dfCountL2.length === 0) return;
        try {
          const client = await getReadySupabaseClient();
          if (!client) throw new Error("Không thể xác thực Supabase.");
          const ym = `${archiveYear}-${String(archiveMonth).padStart(2, '0')}`;
          let label = `Tháng ${String(archiveMonth).padStart(2, '0')}/${archiveYear}`;
          if (archiveLabel.trim()) label += ` — ${archiveLabel.trim()}`;

          const summaryData = dfCountL2.map(r => ({
            SKU: r.sku,
            'Tên hàng hóa': r.name,
            'ĐVT': r.uom,
            'Số lượng sổ sách': r.qtySys,
            'Số lượng thực tế': r.totalActual,
            'Chênh lệch': r.totalActual - r.qtySys
          }));

          const payload = {
            year_month: ym,
            session_name: label,
            // Bảng production cũ chỉ có cột summary. Đóng gói toàn bộ snapshot
            // vào JSONB này để tương thích mà không phụ thuộc schema cache.
            summary: {
              data: summaryData,
              _label: label,
              _archive_version: 2,
              df_count_l2: dfCountL2,
              df_detail: dfCheckDetail
            }
          };

          const { error } = await client
            .from('monthly_archives')
            .upsert(payload, { onConflict: 'year_month' });

          if (!error) {
            const { data: archives } = await client
              .from('monthly_archives')
              .select('id, year_month')
              .order('year_month', { ascending: false });
            if (archives && archives.length > 12) {
              const oldIds = archives.slice(12).map(row => row.id);
              const { error: pruneError } = await client
                .from('monthly_archives')
                .delete()
                .in('id', oldIds);
              if (pruneError) console.error("Không thể xóa archive cũ:", pruneError);
            }
            alert(`✅ Đã lưu báo cáo ${label} thành công!`);
            fetchMonthlyArchives();
          } else { alert("Lỗi lưu archive: " + error.message); }
        } catch (e) { alert("Lỗi: " + e.message); }
      };

      const handleLoadMonthlyArchive = async (yearMonth) => {
        if (!supabaseClient) return;
        try {
          const client = await getReadySupabaseClient();
          if (!client) throw new Error("Không thể xác thực Supabase.");
          const { data, error } = await client
            .from('monthly_archives')
            .select('*')
            .eq('year_month', yearMonth)
            .single();
          if (error) throw error;
          if (!data) return;
          const summaryPayload = data.summary && typeof data.summary === "object"
            ? data.summary
            : {};
          const [countRows, detailRows] = await Promise.all([
            decodeStoredRows(data.df_count_l2 ?? summaryPayload.df_count_l2),
            decodeStoredRows(data.df_detail ?? summaryPayload.df_detail)
          ]);
          const loadedDetails = normalizeDetailRows(detailRows);
          setDfCountL2(syncCountsWithDetail(countRows.map(adaptLegacyCountRow), loadedDetails));
          setDfCheckDetail(loadedDetails);
          setSessionName(`Archive ${data.session_name || data.label || summaryPayload._label || yearMonth}`);
          setActiveSessionId(null);
          setIsDirty(false);
          setActiveTab("variance-summary");
        } catch (e) {
          alert("Lỗi tải báo cáo tháng: " + e.message);
        }
      };

      // --- INLINE EDITING HANDLERS ---
      const handleL2QtyChange = (sku, val) => {
        const num = Math.max(0, parseQuantity(val, 0));
        setDfCountL2(prev => prev.map(r => {
          if (r.sku === sku) {
            const totalActual = r.qtyL1 + num;
            const diffL2 = totalActual - r.qtySys;
            return { ...r, qtyL2: num, totalActual, diffL2 };
          }
          return r;
        }));
        setIsDirty(true);
      };

      const handleL2NoteChange = (sku, note) => {
        setDfCountL2(prev => prev.map(r => r.sku === sku ? { ...r, note } : r));
        setIsDirty(true);
      };

      const handleSerialEdit = (rowId, newSerial) => {
        setDfCheckDetail(prev => {
          const updated = prev.map(row => ({ ...row }));
          const idx = updated.findIndex(row => row.rowId === rowId);
          if (idx < 0) return prev;
          const row = updated[idx];
          const oldSerial = row.scannedSerial;
          if (newSerial === "" && (String(row.status || "").includes("Bắn dư") || oldSerial !== "")) {
            setPendingClearSerial({
              rowId,
              sku: row.sku,
              serial: oldSerial,
              stockSerial: row.stockSerial,
              l2Added: Boolean(row.l2Added),
              removalKind: row.status === "Bắn sai serial" ? "wrong" : "surplus"
            });
            return prev;
          }
          if (!oldSerial && newSerial) row.l2Added = true;
          row.scannedSerial = newSerial;
          row.checked = newSerial ? 1 : 0;
          row.diff = newSerial ? 0 : -1;
          if (!newSerial) row.status = "Bắn thiếu (Chưa quét)";
          else if (serialsMatch(row.stockSerial, newSerial)) row.status = "Đã quét đủ";
          else if (!String(row.stockSerial || "").trim()) row.status = "Bắn dư serial";
          else row.status = "Bắn sai serial";
          return updated;
        });
        setIsDirty(true);
      };

      const handleSerialEditCommit = (rowId, originalSerial) => {
        setDfCheckDetail(prev => prev.map(row => {
          if (row.rowId !== rowId || row.scannedSerial === originalSerial) return row;
          const audit = `[Sửa Serial: ${originalSerial || "trống"} → ${row.scannedSerial || "trống"}]`;
          const baseNote = String(row.note || "").replace(/\s*\[Sửa Serial:[^\]]*\]/g, "").trim();
          return { ...row, note: [baseNote, audit].filter(Boolean).join(" ") };
        }));
      };

      const handleSerialNoteChange = (rowId, note) => {
        setDfCheckDetail(prev => prev.map(row => {
          if (row.rowId !== rowId) return row;
          return { ...row, note };
        }));
        setIsDirty(true);
      };

      const confirmClearSurplusSerial = () => {
        if (!clearReasonInput.trim() || !pendingClearSerial) {
          alert("Vui lòng nhập lý do loại bỏ!");
          return;
        }
        const { rowId, sku, serial, l2Added, removalKind } = pendingClearSerial;
        setDfCheckDetail(prev => {
          const updated = prev.map(row => ({ ...row }));
          const idx = updated.findIndex(row => row.rowId === rowId);
          if (idx < 0) return prev;
          const r = updated[idx];
          r.scannedSerial = "";
          r.checked = 0;
          const removalAudit = removalKind === "wrong"
            ? `[Đã xóa Serial sai ${serial} - Lý do: ${clearReasonInput.trim()}]`
            : `[Đã loại bỏ Serial dư ${serial} - Lý do: ${clearReasonInput.trim()}]`;
          r.diff = removalKind === "wrong" ? -1 : 0;
          r.status = removalKind === "wrong" ? "Bắn thiếu (Chưa quét)" : "Đã loại bỏ Serial dư";
          r.note = [String(r.note || "").trim(), removalAudit].filter(Boolean).join(" ");
          return updated;
        });
        setDfCountL2(countRows => countRows.map(row => {
          if (row.sku !== sku) return row;
          const qtyL1 = l2Added ? row.qtyL1 : Math.max(0, row.qtyL1 - 1);
          const qtyL2 = l2Added ? Math.max(0, row.qtyL2 - 1) : row.qtyL2;
          const totalActual = qtyL1 + qtyL2;
          return { ...row, qtyL1, qtyL2, totalActual, diffL2: totalActual - row.qtySys };
        }));

        setPendingClearSerial(null);
        setClearReasonInput("");
        setIsDirty(true);
      };

      // --- EXPORT HANDLERS ---
      const handleExportExcel = () => {
        if (dfCountL2.length === 0) return;
        const wb = XLSX.utils.book_new();

        const border = {
          top: { style: "thin", color: { rgb: "808080" } },
          bottom: { style: "thin", color: { rgb: "808080" } },
          left: { style: "thin", color: { rgb: "808080" } },
          right: { style: "thin", color: { rgb: "808080" } }
        };
        const styleTable = (ws, {
          headerRow = 0,
          dataStart = 1,
          dataEnd,
          totalRow = null,
          widths,
          centerColumns = [],
          numericColumns = [],
          wrapColumns = []
        }) => {
          const range = XLSX.utils.decode_range(ws["!ref"]);
          ws["!cols"] = widths.map(wch => ({ wch }));
          ws["!rows"] = ws["!rows"] || [];
          ws["!rows"][headerRow] = { hpt: 28 };
          ws["!autofilter"] = {
            ref: XLSX.utils.encode_range({
              s: { r: headerRow, c: 0 },
              e: { r: Math.max(headerRow, dataEnd), c: range.e.c }
            })
          };

          for (let c = 0; c <= range.e.c; c += 1) {
            const headerCell = ws[XLSX.utils.encode_cell({ r: headerRow, c })];
            if (headerCell) {
              headerCell.s = {
                font: { bold: true, color: { rgb: "1F2937" }, sz: 11 },
                fill: { patternType: "solid", fgColor: { rgb: "D9E1F2" } },
                alignment: { horizontal: "center", vertical: "center", wrapText: true },
                border
              };
            }
          }

          for (let r = dataStart; r <= dataEnd; r += 1) {
            ws["!rows"][r] = { hpt: 30 };
            for (let c = 0; c <= range.e.c; c += 1) {
              const cell = ws[XLSX.utils.encode_cell({ r, c })];
              if (!cell) continue;
              cell.s = {
                font: { sz: 10, color: { rgb: "111827" } },
                alignment: {
                  horizontal: numericColumns.includes(c) ? "right" : (centerColumns.includes(c) ? "center" : "left"),
                  vertical: "center",
                  wrapText: wrapColumns.includes(c)
                },
                border
              };
              if (numericColumns.includes(c)) cell.z = c === 6 ? '0;[Red](0);-' : '0';
            }
          }

          if (totalRow !== null) {
            ws["!rows"][totalRow] = { hpt: 28 };
            for (let c = 0; c <= range.e.c; c += 1) {
              const cell = ws[XLSX.utils.encode_cell({ r: totalRow, c })];
              if (!cell) continue;
              cell.s = {
                font: { bold: true, color: { rgb: "C00000" }, sz: 10 },
                fill: { patternType: "solid", fgColor: { rgb: "FFF2CC" } },
                alignment: {
                  horizontal: numericColumns.includes(c) ? "right" : "left",
                  vertical: "center",
                  wrapText: true
                },
                border
              };
              if (numericColumns.includes(c)) cell.z = c === 6 ? '0;[Red](0);-' : '0';

          if (filterMainStatus === "Bắn dư serial" && !r.chkStatus.includes("Bắn dư")) return false;
          if (filterMainStatus === "Bắn thừa hàng" && !r.chkStatus.includes("Bắn thừa")) return false;
          if (filterMainStatus === "Bắn thiếu hàng" && !r.chkStatus.includes("Bắn thiếu")) return false;
          if (filterMainStatus === "Khớp hoàn toàn" && r.chkStatus !== "Khớp hoàn toàn") return false;

          if (searchMain.trim()) {
            const kw = searchMain.toLowerCase();
            return r.sku.toLowerCase().includes(kw) || r.name.toLowerCase().includes(kw);
          }
          return true;
        });
        return sortRows(rows, sortMain);

          setAuthActionMessage("Đã gửi email đổi mật khẩu. Hãy kiểm tra hộp thư.");
