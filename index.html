          [`3. Thành phần tham gia kiểm kê: Quản lý đơn vị - ${mgrName}; Đại diện kiểm kê / Kho - ${staffName}`],
          [],
          ["Mã VT", "Tên vật tư hàng hóa", "Đvt", "Kiểm kê thực tế (A)", "Tồn cuối phần mềm (B)", "Thừa A-B", "Thiếu B-A", "Giải trình chênh lệch", "Đề xuất xử lý"],
          ...tableRows,
          ["Tổng cộng", "", "", "", "", "", "", "", ""],
          [],
          ["Quản lý Đơn vị", "", "", "Đại diện kiểm kê / Kho", "", "", "Thủ kho / Nhân viên kho", "", ""],
          ["(Ký, ghi rõ họ tên)", "", "", "(Ký, ghi rõ họ tên)", "", "", "(Ký, ghi rõ họ tên)", "", ""]
        ];
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        const border = {
          top: { style: "thin", color: { rgb: "64748B" } },
          bottom: { style: "thin", color: { rgb: "64748B" } },
          left: { style: "thin", color: { rgb: "64748B" } },
          right: { style: "thin", color: { rgb: "64748B" } }
        };

        const sigTitleRow = totalRow + 2;
        const sigSubRow = totalRow + 3;

        ws["!merges"] = [0, 1, 3, 4, 5].map(row => ({
          s: { r: row, c: 0 }, e: { r: row, c: 8 }
        }));
        ws["!merges"].push({ s: { r: totalRow, c: 0 }, e: { r: totalRow, c: 2 } });
        ws["!merges"].push(
          { s: { r: sigTitleRow, c: 0 }, e: { r: sigTitleRow, c: 2 } },
          { s: { r: sigTitleRow, c: 3 }, e: { r: sigTitleRow, c: 5 } },
          { s: { r: sigTitleRow, c: 6 }, e: { r: sigTitleRow, c: 8 } },
          { s: { r: sigSubRow, c: 0 }, e: { r: sigSubRow, c: 2 } },
          { s: { r: sigSubRow, c: 3 }, e: { r: sigSubRow, c: 5 } },
          { s: { r: sigSubRow, c: 6 }, e: { r: sigSubRow, c: 8 } }
        );

        ws["!cols"] = [15, 48, 10, 17, 18, 12, 12, 42, 42].map(wch => ({ wch }));
        ws["!rows"] = ws["!rows"] || [];
        ws["!rows"][0] = { hpt: 32 };
        ws["!rows"][1] = { hpt: 24 };
        ws["!rows"][3] = { hpt: 22 };
        ws["!rows"][4] = { hpt: 22 };
        ws["!rows"][5] = { hpt: 24 };
        ws["!rows"][headerRow] = { hpt: 38 };
        ws["!rows"][sigTitleRow] = { hpt: 26 };
        ws["!rows"][sigSubRow] = { hpt: 20 };

        ws["!autofilter"] = { ref: `A${headerRow + 1}:I${totalRow}` };
        ws["!pageSetup"] = { orientation: "landscape", fitToWidth: 1, fitToHeight: 0, paperSize: 9 };
        ws["!margins"] = { left: 0.25, right: 0.25, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 };

        for (let row = 0; row < headerRow; row += 1) {
          for (let column = 0; column < 9; column += 1) {
            const ref = XLSX.utils.encode_cell({ r: row, c: column });
            const cell = ws[ref] || { t: "s", v: "" };
            cell.s = {
              ...(cell.s || {}),
              font: { name: "Times New Roman", sz: 10.5, color: { rgb: "000000" } },
              fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } }
            };
            ws[ref] = cell;
          }
        }

        ws.A1.s = {
          font: { name: "Times New Roman", bold: true, sz: 15, color: { rgb: "000000" } },
          fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
          alignment: { horizontal: "center", vertical: "center" }
        };
        ws.A2.s = {
          font: { name: "Times New Roman", bold: true, sz: 11, color: { rgb: "000000" } },
          fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
          alignment: { horizontal: "center", vertical: "center", wrapText: true }
        };
        [3, 4, 5].forEach(row => {
          const cell = ws[XLSX.utils.encode_cell({ r: row, c: 0 })];
          cell.s = {
            font: { name: "Times New Roman", sz: 10.5, color: { rgb: "000000" } },
            fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
            alignment: { horizontal: "left", vertical: "center", wrapText: true }
          };
        });

        for (let column = 0; column < 9; column += 1) {
          const cell = ws[XLSX.utils.encode_cell({ r: headerRow, c: column })];
          cell.s = {
            font: { name: "Times New Roman", bold: true, sz: 10.5, color: { rgb: "000000" } },
            fill: { patternType: "solid", fgColor: { rgb: column === 5 || column === 6 ? "FFF2CC" : "CFE2F3" } },
            alignment: { horizontal: "center", vertical: "center", wrapText: true },
            border
          };
        }

        tableRows.forEach((row, rowIndex) => {
          const sheetRow = dataStartRow + rowIndex;
          ws["!rows"][sheetRow] = { hpt: 36 };
          for (let column = 0; column < 9; column += 1) {
            const cell = ws[XLSX.utils.encode_cell({ r: sheetRow, c: column })];
            if (!cell) continue;
            cell.s = {
              font: { name: "Times New Roman", sz: 10, color: { rgb: "000000" } },
              fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
              alignment: {
                horizontal: column >= 3 && column <= 6 ? "right" : (column === 2 ? "center" : "left"),
                vertical: "center",
                wrapText: column === 1 || column >= 7
              },
              border
            };
            if (column >= 3 && column <= 6) cell.z = '#,##0;[Red](#,##0);"-"';
          }
        });

        const excelFirstDataRow = dataStartRow + 1;
        const excelLastDataRow = totalRow;
        const totals = [
          discrepancyRows.reduce((sum, row) => sum + row.totalActual, 0),
          discrepancyRows.reduce((sum, row) => sum + row.qtySys, 0),
          discrepancyRows.reduce((sum, row) => sum + Math.max(row.diff, 0), 0),
          discrepancyRows.reduce((sum, row) => sum + Math.max(-row.diff, 0), 0)
        ];
        [3, 4, 5, 6].forEach(column => {
          const cell = ws[XLSX.utils.encode_cell({ r: totalRow, c: column })] || {};
          cell.f = `SUM(${XLSX.utils.encode_col(column)}${excelFirstDataRow}:${XLSX.utils.encode_col(column)}${excelLastDataRow})`;
          cell.t = "n";
          cell.v = totals[column - 3];
          cell.z = '#,##0;[Red](#,##0);"-"';
          ws[XLSX.utils.encode_cell({ r: totalRow, c: column })] = cell;
        });
        for (let column = 0; column < 9; column += 1) {
          const ref = XLSX.utils.encode_cell({ r: totalRow, c: column });
          const cell = ws[ref] || { t: "s", v: "" };
          cell.s = {
            font: { name: "Times New Roman", bold: true, sz: 10.5, color: { rgb: "C00000" } },
            fill: { patternType: "solid", fgColor: { rgb: "FFF2CC" } },
            alignment: { horizontal: column >= 3 && column <= 6 ? "right" : "left", vertical: "center" },
            border
          };
          ws[ref] = cell;
        }

        [0, 3, 6].forEach(c => {
          const sigT = ws[XLSX.utils.encode_cell({ r: sigTitleRow, c })];
          if (sigT) {
            sigT.s = {
              font: { name: "Times New Roman", bold: true, sz: 10.5, color: { rgb: "000000" } },
              alignment: { horizontal: "center", vertical: "center" }
            };
          }
          const sigS = ws[XLSX.utils.encode_cell({ r: sigSubRow, c })];
          if (sigS) {
            sigS.s = {
              font: { name: "Times New Roman", italic: true, sz: 9.5, color: { rgb: "555555" } },
              alignment: { horizontal: "center", vertical: "center" }
            };
          }
        });

        XLSX.utils.book_append_sheet(wb, ws, "Giai trinh chenh lech");
        XLSX.writeFile(wb, `Bien_Ban_Giai_Trinh_Chenh_Lech_${reportDate.replace(/-/g, '')}.xlsx`);
        setExplanationModalOpen(false);
      };

      const recountNotesBySku = useMemo(() => {
        const notes = {};
        (recountTasks || []).forEach(task => {
          const note = String(task.reason || "").trim();
          if (!note) return;
          if (!notes[task.sku]) notes[task.sku] = [];
          if (!notes[task.sku].includes(note)) notes[task.sku].push(note);
        });
        return notes;
      }, [recountTasks]);

      // --- DERIVED TAB 4 SUMMARY ROWS ---
      const dfMainRows = useMemo(() => {
        if (dfCountL2.length === 0 || dfCheckDetail.length === 0) return [];

        const wrongSerialSkus = new Set(dfCheckDetail.filter(r => r.status === 'Bắn sai serial').map(r => r.sku));
        const surplusSkus = new Set(dfCheckDetail.filter(r => String(r.status || "").includes('Bắn dư')).map(r => r.sku));

        const detailNotesBySku = {};
        dfCheckDetail.forEach(r => {
          // Serial đã khớp ở lần 2 vẫn giữ audit tại sheet chi tiết,
          // nhưng không còn là vấn đề cần đưa vào báo cáo tổng hợp.
          if (r.note && r.status !== "Đã quét đủ") {
            if (!detailNotesBySku[r.sku]) detailNotesBySku[r.sku] = [];
            if (!detailNotesBySku[r.sku].includes(r.note)) detailNotesBySku[r.sku].push(r.note);
          }
        });

        return dfCountL2.map(r => {
          const sku = r.sku;
          const name = r.name;
          const uom = r.uom;
          const qtySys = r.qtySys;
          const qtyL1 = r.qtyL1;
          const qtyL2 = r.qtyL2;
          const totalActual = qtyL1 + qtyL2;
          const diff = totalActual - qtySys;

          const l2Note = r.note || "";
          const dtNote = (detailNotesBySku[sku] || []).join(" | ");
          const recountNote = (recountNotesBySku[sku] || []).join(" | ");
          // Cùng một ghi chú có thể được lưu ở cả chi tiết serial và kiểm đếm L2.
          // Chuẩn hóa và loại trùng trước khi đưa lên báo cáo.
          const combinedNote = dedupeReportNotes(dtNote, l2Note, recountNote);
          // Ghi chú xử lý vẫn được giữ ở dữ liệu chi tiết để truy vết,
          // nhưng báo cáo tổng hợp chỉ hiển thị ghi chú khi SKU còn lệch tồn.
          const reportNote = diff !== 0 ? combinedNote : "";

          let chkStatus = "Khớp hoàn toàn";
          if (wrongSerialSkus.has(sku)) chkStatus = "Bắn sai serial";
          else if (surplusSkus.has(sku)) chkStatus = "Bắn dư serial";
          else if (qtySys > qtyL1 && totalActual === qtySys) chkStatus = "Bắn thiếu hàng - Kiểm lần 2 đủ";
          else if (qtySys > qtyL1 && totalActual < qtySys) chkStatus = `Bắn thiếu hàng - Kiểm lần 2 thiếu ${Math.abs(diff)}`;
          else if (totalActual < qtySys) chkStatus = "Bắn thiếu hàng";
          else if (totalActual > qtySys) chkStatus = `Bắn thừa hàng ${diff}`;

          return {
            sku, name, uom, qtySys, qtyL1, qtyL2, totalActual, diff, chkStatus, note: reportNote
          };
        });
      }, [dfCountL2, dfCheckDetail, recountNotesBySku]);

      // Filtered Views
      const filteredDetailRows = useMemo(() => {
        const rows = dfCheckDetail.filter(r => {
          if (filterDetailStatus === "Chỉ Serial chênh lệch (Dư / Thiếu)" && r.diff === 0 && r.status === "Đã quét đủ") return false;
          if (filterDetailStatus === "Thiếu (Chưa quét)" && r.status !== "Bắn thiếu (Chưa quét)") return false;
          if (filterDetailStatus === "Bắn sai serial" && r.status !== "Bắn sai serial") return false;
          if (filterDetailStatus === "Bắn dư serial" && !String(r.status || "").includes("Bắn dư")) return false;
          if (filterDetailStatus === "Đã quét đủ" && r.status !== "Đã quét đủ") return false;
          if (filterDetailStatus === "Đã loại bỏ Serial dư" && r.status !== "Đã loại bỏ Serial dư") return false;

          if (searchDetail.trim()) {
            const kw = searchDetail.toLowerCase();
            return r.sku.toLowerCase().includes(kw) || r.name.toLowerCase().includes(kw) || (r.stockSerial && r.stockSerial.toLowerCase().includes(kw)) || (r.scannedSerial && r.scannedSerial.toLowerCase().includes(kw));
          }
          return true;
        });
        return sortRows(rows, sortDetail);
      }, [dfCheckDetail, filterDetailStatus, searchDetail, sortDetail]);

      const filteredL2Rows = useMemo(() => {
        const rows = dfCountL2.filter(r => {
          if (filterL2Mode.startsWith("Chỉ SKU") && r.diffL2 === 0 && r.qtyL2 === 0) return false;
          if (filterL2Status === "Lệch chưa đếm bù" && (r.diffL2 === 0 || r.qtyL2 > 0)) return false;
          if (filterL2Status === "Đã nhập đếm bù Lần 2" && r.qtyL2 === 0) return false;
          if (filterL2Status === "Đã khớp sau đếm bù" && r.diffL2 !== 0) return false;

          if (searchL2.trim()) {
            const kw = searchL2.toLowerCase();
            return r.sku.toLowerCase().includes(kw) || r.name.toLowerCase().includes(kw);
          }
          return true;
        });
        return sortRows(rows, sortL2);
      }, [dfCountL2, filterL2Mode, filterL2Status, searchL2, sortL2]);

      // Danh sách sản phẩm chênh lệch cần kiểm lần 2 (Rule hiển thị giữ nguyên: Bắn thiếu, Bắn sai serial, Bắn dư)
      const recountDiscrepancies = useMemo(() => {
        return dfCheckDetail.filter(r => (
          r.status === "Bắn thiếu (Chưa quét)" ||
          r.status === "Bắn sai serial" ||
          (typeof r.status === "string" && r.status.startsWith("Bắn dư"))
        ));
      }, [dfCheckDetail]);

      const availableRecountBins = useMemo(() => {
        const bins = new Set();
        recountDiscrepancies.forEach(r => {
          const b = String(r.bin || "").trim();
          if (b) bins.add(b);
        });
        return Array.from(bins).sort();
      }, [recountDiscrepancies]);

      const syncRecountToSupabaseTimerRef = useRef(null);

      const handleToggleRecountProcessed = (targetIdentifier, checked) => {
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")} ${String(now.getDate()).padStart(2, "0")}/${String(now.getMonth() + 1).padStart(2, "0")}/${now.getFullYear()}`;
        const currentUserName = profile?.full_name || profile?.erp_name || session?.user?.email || (isManager ? "Quản lý" : "Nhân viên kiểm lại");

        setDfCheckDetail(prev => {
          const next = (prev || []).map((r, idx) => {
            const rowId = r.rowId || `${r.sku}::${r.stockSerial || r.scannedSerial || idx}`;
            if (rowId !== targetIdentifier && r.rowId !== targetIdentifier) return r;
            const willBeChecked = Boolean(checked);
            const historyItem = {
              at: timeStr,
              by: currentUserName,
              action: willBeChecked ? "Đã xử lý xong" : "Mở lại (chưa xử lý)",
              note: r.processNote || ""
            };
            const prevHistory = Array.isArray(r.processHistory) ? r.processHistory : [];
            return {
              ...r,
              rowId,
              processed: willBeChecked,
              processedBy: willBeChecked ? currentUserName : (r.processNote ? r.processedBy : ""),
              processedAt: willBeChecked ? timeStr : (r.processNote ? r.processedAt : ""),
              processHistory: [...prevHistory, historyItem]
            };
          });

          saveLocalDraft({
            activeTab,
            activeSessionId,
            sessionName,
            lastSavedTime,
            rawStockFileName,
            rawErpFileName,
            filterDetailStatus,
            dfCheckDetail: next,
            dfCountL2
          });

          if (activeSessionId) {
            if (syncRecountToSupabaseTimerRef.current) clearTimeout(syncRecountToSupabaseTimerRef.current);
            syncRecountToSupabaseTimerRef.current = setTimeout(async () => {
              try {
                const client = await getReadySupabaseClient();
                if (client) {
                  await client
                    .from('inventory_sessions')
                    .update({ data: { df_count_l2: dfCountL2, df_check_detail: next } })
                    .eq('id', activeSessionId);
                }
              } catch (_err) {}
            }, 600);
          }

          return next;
        });

        if (checked) {
          showNotice("✅ Đã ghi nhận: Đã xử lý xong!");
        } else {
          showNotice("Đã mở lại dòng kiểm kê (chưa xử lý).");
        }
      };

      const handleUpdateRecountNote = (targetIdentifier, noteValue) => {
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")} ${String(now.getDate()).padStart(2, "0")}/${String(now.getMonth() + 1).padStart(2, "0")}/${now.getFullYear()}`;
        const currentUserName = profile?.full_name || profile?.erp_name || session?.user?.email || (isManager ? "Quản lý" : "Nhân viên kiểm lại");

        setDfCheckDetail(prev => {
          const next = (prev || []).map((r, idx) => {
            const rowId = r.rowId || `${r.sku}::${r.stockSerial || r.scannedSerial || idx}`;
            if (rowId !== targetIdentifier && r.rowId !== targetIdentifier) return r;
            const historyItem = {
              at: timeStr,
              by: currentUserName,
              action: "Cập nhật ghi chú",
              note: noteValue
            };
            const prevHistory = Array.isArray(r.processHistory) ? r.processHistory : [];
            return {
              ...r,
              rowId,
              processNote: noteValue,
              processedBy: r.processedBy || currentUserName,
              processedAt: r.processedAt || timeStr,
              processHistory: [...prevHistory, historyItem]
            };
          });

          saveLocalDraft({
            activeTab,
            activeSessionId,
            sessionName,
            lastSavedTime,
            rawStockFileName,
            rawErpFileName,
            filterDetailStatus,
            dfCheckDetail: next,
            dfCountL2
          });

          if (activeSessionId) {
            if (syncRecountToSupabaseTimerRef.current) clearTimeout(syncRecountToSupabaseTimerRef.current);
            syncRecountToSupabaseTimerRef.current = setTimeout(async () => {
              try {
                const client = await getReadySupabaseClient();
                if (client) {
                  await client
                    .from('inventory_sessions')
                    .update({ data: { df_count_l2: dfCountL2, df_check_detail: next } })
                    .eq('id', activeSessionId);
                }
              } catch (_err) {}
            }, 600);
          }

          return next;
        });

        showNotice("💾 Đã lưu ghi chú xử lý.");
      };

      const filteredRecountGuideRows = useMemo(() => {
        return recountDiscrepancies.filter(r => {
          if (filterRecountGuideStatus === "Bắn thiếu (Chưa quét)" && r.status !== "Bắn thiếu (Chưa quét)") return false;
          if (filterRecountGuideStatus === "Bắn sai serial" && r.status !== "Bắn sai serial") return false;
          if (filterRecountGuideStatus === "Bắn dư serial" && !String(r.status || "").startsWith("Bắn dư")) return false;

          if (filterRecountGuideBin !== "Tất cả" && String(r.bin || "").trim() !== filterRecountGuideBin) return false;

          if (filterRecountGuideProcessed === "Chưa xử lý" && r.processed) return false;
          if (filterRecountGuideProcessed === "Đã xử lý" && !r.processed) return false;

          if (searchRecountGuide.trim()) {
            const kw = searchRecountGuide.trim().toLowerCase();
            const matchSku = String(r.sku || "").toLowerCase().includes(kw);
            const matchName = String(r.name || "").toLowerCase().includes(kw);
            const matchStockSerial = String(r.stockSerial || "").toLowerCase().includes(kw);
            const matchScannedSerial = String(r.scannedSerial || "").toLowerCase().includes(kw);
            const matchBin = String(r.bin || "").toLowerCase().includes(kw);
            const matchPerformer = String(r.performedBy || "").toLowerCase().includes(kw);
            const matchNote = String(r.processNote || "").toLowerCase().includes(kw);
            const matchHandler = String(r.processedBy || "").toLowerCase().includes(kw);
            if (!matchSku && !matchName && !matchStockSerial && !matchScannedSerial && !matchBin && !matchPerformer && !matchNote && !matchHandler) {
              return false;
            }
          }
          return true;
        });
      }, [recountDiscrepancies, filterRecountGuideStatus, filterRecountGuideBin, filterRecountGuideProcessed, searchRecountGuide]);

      const handleExportRecountGuideExcel = () => {
        if (filteredRecountGuideRows.length === 0) {
          showNotice("Không có dòng chênh lệch nào để xuất.");
          return;
        }
        const exportRows = filteredRecountGuideRows.map((r, idx) => ({
          "STT": idx + 1,
          "Mã SKU": r.sku || "",
          "Tên sản phẩm": r.name || "",
          "Vị trí BIN": r.bin || "—",
          "Serial cần tìm (Sổ sách)": r.stockSerial || "—",
          "Serial đã quét L1": r.scannedSerial || "—",
          "Phân loại chênh lệch": r.status || "",
          "Người kiểm L1": r.performedBy || "—",
          "Thời gian quét L1": formatInventoryTime(r.inventoryTime) || "—",
          "Ghi chú xử lý": r.processNote || "",
          "Trạng thái xử lý": r.processed ? `Đã xử lý xong (${r.processedBy || ''} - ${r.processedAt || ''})` : "Chưa xử lý"
        }));
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(exportRows);
        XLSX.utils.book_append_sheet(wb, ws, "Kiem_Lan_2");
        const safeSession = (sessionName || 'dot_kiem_ke').replace(/[^a-zA-Z0-9_\u00C0-\u024F\u1EA0-\u1EF9]/g, '_');
        XLSX.writeFile(wb, `Danh_Sach_Kiem_Lan_2_${safeSession}_${new Date().toISOString().slice(0, 10)}.xlsx`);
        showNotice("✅ Đã xuất file Excel danh sách kiểm Lần 2!");
      };

      const handleCopyRecountGuideList = () => {
        if (filteredRecountGuideRows.length === 0) return;
        const header = "STT\tMã SKU\tTên sản phẩm\tVị trí BIN\tSerial cần tìm\tSerial quét L1\tPhân loại\tNgười kiểm L1\tThời gian quét L1\tGhi chú xử lý\tTrạng thái xử lý\n";
        const body = filteredRecountGuideRows.map((r, idx) =>
          `${idx + 1}\t${r.sku || ''}\t${r.name || ''}\t${r.bin || ''}\t${r.stockSerial || ''}\t${r.scannedSerial || ''}\t${r.status || ''}\t${r.performedBy || ''}\t${formatInventoryTime(r.inventoryTime) || ''}\t${r.processNote || ''}\t${r.processed ? 'Đã xử lý' : 'Chưa xử lý'}`
        ).join("\n");
        navigator.clipboard.writeText(header + body).then(() => {
          showNotice("📋 Đã sao chép danh sách vào clipboard!");
        }).catch(() => {

          if (filterMainStatus === "Bắn thiếu hàng" && !r.chkStatus.includes("Bắn thiếu")) return false;
          if (filterMainStatus === "Khớp hoàn toàn" && r.chkStatus !== "Khớp hoàn toàn") return false;

          setAuthActionMessage("Đã gửi email đổi mật khẩu. Hãy kiểm tra hộp thư.");

                aria-modal="true"
                aria-labelledby="remove-serial-title"
                className="w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-slate-200 p-5"
              >
                <h3 id="remove-serial-title" className="text-base font-extrabold text-slate-800">
                  {pendingClearSerial.removalKind === "wrong" ? "Xóa Serial bắn sai" : "Loại bỏ Serial dư"}
                </h3>
                <div className="mt-3 rounded-xl bg-slate-50 border border-slate-200 p-3 text-xs space-y-1">
                  <p><span className="font-bold">SKU:</span> {pendingClearSerial.sku}</p>
                  <p><span className="font-bold">Serial sổ sách:</span> {pendingClearSerial.stockSerial || "—"}</p>
                  <p><span className="font-bold">Serial đã quét:</span> {pendingClearSerial.serial || "—"}</p>
                </div>
                <label htmlFor="remove-serial-reason" className="block mt-4 text-xs font-bold text-slate-700">
                  Lý do xóa <span className="text-rose-600">*</span>
                </label>
                <textarea
                  id="remove-serial-reason"
                  autoFocus
                  rows="3"
                  value={clearReasonInput}
                  onChange={e => setClearReasonInput(e.target.value)}
                  placeholder="Nhập lý do bắt buộc..."
                  className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                <div className="mt-4 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setPendingClearSerial(null);
                      setClearReasonInput("");
                    }}
                    className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
                  >
                    Hủy
                  </button>
                  <button
                    type="button"
                    onClick={confirmClearSurplusSerial}
                    disabled={!clearReasonInput.trim()}
                    className="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-xs font-bold"
                  >
                    Xác nhận xóa
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const {
        session,
        profile,
        loading,
        error,
        legacyMode,
        profileMissing,
        recovery,
        retry,
        completeRecovery
      } = useAuthState();

      if (loading) {
        return (
          <AuthCard>
            <h1 className="text-lg font-bold text-slate-900">Đang tải tài khoản…</h1>
            <p className="mt-2 text-sm text-slate-500">Hệ thống đang xác minh phiên đăng nhập và quyền truy cập.</p>
          </AuthCard>
        );
      }

      if (recovery) {
        return <UpdatePasswordForm onComplete={completeRecovery} />;
      }

      if (error) {
        return <AuthErrorScreen message={error} onRetry={retry} />;
      }

      if (!session) {
        return <AuthForm />;
      }

      if (legacyMode) {
        return <ApplicationShell session={session} profile={null} legacyMode={true} />;
      }

      if (profileMissing || !profile) {
        return (
          <AccountStateScreen
            title="Không tìm thấy hồ sơ tài khoản"
            description="Tài khoản chưa có hồ sơ truy cập hợp lệ. Hãy thử lại hoặc liên hệ quản trị viên."
            profile={{ email: session.user?.email }}
            onRetry={retry}
          />
        );
      }

      if (profile.status === "pending") {
        return (
          <AccountStateScreen
            title="Chờ phê duyệt"
            description="Tài khoản đã đăng ký thành công và đang chờ quản lý phê duyệt."
            profile={profile}
          />
        );
      }

      if (profile.status === "locked" || profile.status === "deleted") {
        return (
          <AccountStateScreen
            title="Quyền truy cập đã bị vô hiệu hóa"
            description="Tài khoản này đã bị khóa hoặc xóa. Vui lòng liên hệ quản trị viên."
            profile={profile}
          />
        );
      }

      const allowedRole = profile.role === "counter" || profile.role === "manager" || profile.role === "admin";
      if (profile.status !== "active" || !allowedRole) {
        return (
          <AccountStateScreen
            title="Quyền truy cập đã bị vô hiệu hóa"
            description="Trạng thái hoặc vai trò tài khoản không hợp lệ. Vui lòng liên hệ quản trị viên."
            profile={profile}
          />
        );
      }

      return <ApplicationShell session={session} profile={profile} />;
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
