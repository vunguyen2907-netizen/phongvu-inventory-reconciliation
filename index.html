                        className="bg-slate-50 text-xs border border-slate-300 rounded-lg px-3 py-2 font-medium"
                      >
                        {["Tất cả", "Bắn sai serial", "Bắn dư serial", "Bắn thiếu hàng", "Bắn thừa hàng", "Khớp hoàn toàn"].map(s => (
                          <option key={s} value={s}>{s}</option>
                        ))}
                      </select>
                    </div>

                    <input
                      type="text"
                      placeholder="🔍 Tìm SKU / Tên hàng hóa..."
                      value={searchMain}
                      onChange={e => setSearchMain(e.target.value)}
                      className="bg-slate-50 text-xs border border-slate-300 rounded-lg px-3 py-2 w-64"
                    />
                    <label className="flex items-center gap-2 text-xs font-semibold text-slate-600 cursor-pointer select-none">
                      <input
                        type="checkbox"
                        checked={wrapMainText}
                        onChange={e => setWrapMainText(e.target.checked)}
                        aria-label="Xuống dòng tên & ghi chú"
                        className="h-4 w-4 rounded border-slate-300 accent-blue-600"
                      />
                      Xuống dòng tên &amp; ghi chú
                    </label>
                  </div>

                  <div className="grid grid-cols-4 gap-4">
                    <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                      <p className="text-[11px] font-bold text-slate-400 uppercase">Tổng SKU</p>
                      <p className="text-lg font-extrabold">{dfMainRows.length}</p>
                    </div>
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 shadow-sm">
                      <p className="text-[11px] font-bold text-slate-500 uppercase">Tổng sổ sách</p>
                      <p className="text-lg font-extrabold">{dfMainRows.reduce((sum, r) => sum + r.qtySys, 0)}</p>
                    </div>
                    <div className="bg-brand-50 p-3 rounded-xl border border-blue-200 shadow-sm">
                      <p className="text-[11px] font-bold text-brand-600 uppercase">Tổng thực tế</p>
                      <p className="text-lg font-extrabold text-brand-700">{dfMainRows.reduce((sum, r) => sum + r.totalActual, 0)}</p>
                    </div>
                    <div className="bg-rose-50 p-3 rounded-xl border border-rose-200 shadow-sm">
                      <p className="text-[11px] font-bold text-rose-600 uppercase">SKU cần xử lý</p>
                      <p className="text-lg font-extrabold text-rose-700">{dfMainRows.filter(r => r.chkStatus !== "Khớp hoàn toàn").length}</p>
                    </div>
                  </div>

                  {/* SUMMARY TABLE */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="overflow-x-auto max-h-[550px]">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-100 text-slate-700 font-bold sticky top-0 border-b border-slate-200">
                          <tr>
                            <SortableHeader label="SKU" column="sku" sortConfig={sortMain} onSort={toggleSort(setSortMain)} />
                            <SortableHeader label="Tên hàng hóa" column="name" sortConfig={sortMain} onSort={toggleSort(setSortMain)} />
                            <SortableHeader label="Sổ sách" column="qtySys" sortConfig={sortMain} onSort={toggleSort(setSortMain)} />
                            <SortableHeader label="Thực tế" column="totalActual" sortConfig={sortMain} onSort={toggleSort(setSortMain)} />
                            <SortableHeader label="Chênh lệch" column="diff" sortConfig={sortMain} onSort={toggleSort(setSortMain)} />
                            <SortableHeader label="Phân loại Check" column="chkStatus" sortConfig={sortMain} onSort={toggleSort(setSortMain)} />
                            <SortableHeader label="Ghi chú / Mã đơn" column="note" sortConfig={sortMain} onSort={toggleSort(setSortMain)} />
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredMainRows.map((r, i) => {
                            let bgStyle = "hover:bg-slate-50";
                            if (r.chkStatus === "Bắn sai serial") bgStyle = "bg-amber-50 hover:bg-amber-100/70 text-amber-900";
                            else if (r.chkStatus.includes("Bắn dư")) bgStyle = "bg-orange-50 hover:bg-orange-100/70 text-orange-900";
                            else if (r.chkStatus.includes("Bắn thiếu")) bgStyle = "bg-rose-50 hover:bg-rose-100/70 text-rose-900";
                            else if (r.chkStatus === "Khớp hoàn toàn") bgStyle = "bg-emerald-50/40 hover:bg-emerald-50";

                            return (
                              <tr key={i} className={`transition ${bgStyle}`}>
                                <td className="p-3 font-mono font-medium">{r.sku}</td>
                                <td className={`p-3 max-w-xs ${wrapMainText ? 'whitespace-normal break-words align-top' : 'truncate'}`} title={r.name}>{r.name}</td>
                                <td className="p-3 text-center font-semibold">{r.qtySys}</td>
                                <td className="p-3 text-center font-semibold">{r.totalActual}</td>
                                <td className={`p-3 text-center font-bold ${r.diff < 0 ? 'text-rose-600' : (r.diff > 0 ? 'text-orange-600' : 'text-emerald-600')}`}>
                                  {r.diff > 0 ? `+${r.diff}` : r.diff}
                                </td>
                                <td className="p-3 text-center">
                                  <span className="px-2.5 py-1 rounded-md text-[11px] font-bold inline-block border border-current opacity-90">{r.chkStatus}</span>
                                </td>
                                <td className={`p-3 italic text-slate-600 max-w-xs ${wrapMainText ? 'whitespace-pre-wrap break-words align-top' : 'truncate'}`} title={r.note || ""}>{r.note || "—"}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 6: XUẤT BÁO CÁO */}
              {activeTab === "export" && (
                <div className="space-y-6 max-w-3xl mx-auto">
                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="text-base font-bold text-slate-800">Thông tin Biên bản Kiểm kê Hàng tồn kho</h3>
                    <div className="grid grid-cols-2 gap-4 text-xs">
                      <div>
                        <label className="block font-semibold mb-1">Ngày kiểm kê:</label>
                        <input
                          type="date"
                          value={reportDate}
                          onChange={e => setReportDate(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded p-2"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">Tên Kho / Chi nhánh:</label>
                        <input
                          type="text"
                          value={locationName}
                          onChange={e => setLocationName(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded p-2"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">Quản lý Đơn vị:</label>
                        <input
                          type="text"
                          value={mgrName}
                          onChange={e => setMgrName(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded p-2"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">Đại diện Kiểm kê / Kho:</label>
                        <input
                          type="text"
                          value={staffName}
                          onChange={e => setStaffName(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded p-2"
                        />
                      </div>
                    </div>

                    <div className="pt-4 border-t border-slate-200 grid grid-cols-3 gap-4">
                      <button
                        onClick={handleExportExcel}
                        className="py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition"
                      >
                        📥 Tải xuống File Excel (3 Sheets)
                      </button>
                      <button
                        onClick={handleExportPDF}
                        className="py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-md transition"
                      >
                        📄 Tải xuống Biên Bản PDF Chuẩn Phong Vũ
                      </button>
                      <button
                        onClick={openExplanationReport}
                        className="py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-md transition"
                      >
                        📋 Xuất Biên bản giải trình
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 7: LƯU TRỮ HÀNG THÁNG */}
              {activeTab === "monthly-archive" && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h3 className="text-base font-bold text-slate-800 mb-2">📅 Danh sách Báo cáo Hàng tháng (Rolling 12 tháng)</h3>
                    <p className="text-xs text-slate-500 mb-4">Lưu trữ snapshot báo cáo tổng hợp cuối tháng trên Supabase.</p>

                    <div className="space-y-2">
                      {monthlyArchives.map(a => (
                        <div key={a.id} className="p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center text-xs">
                          <div>
                            <h4 className="font-bold text-slate-800">{a.label}</h4>
                            <p className="text-slate-400">Cập nhật: {new Date(a.updated_at).toLocaleString('vi-VN')}</p>
                          </div>
                          <button
                            onClick={() => handleLoadMonthlyArchive(a.year_month)}
                            className="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded shadow-sm"
                          >
                            Tải báo cáo
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {explanationModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="explanation-report-title"
                className="w-full max-w-6xl max-h-[90vh] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden"
              >
                <div className="p-5 border-b border-slate-200 flex items-start justify-between gap-4">
                  <div>
                    <h3 id="explanation-report-title" className="text-base font-extrabold text-slate-800">
                      Biên bản giải trình chênh lệch kiểm kê hàng hóa
                    </h3>
                    <p className="mt-1 text-xs text-slate-500">
                      Chỉ hiển thị SKU còn lệch tồn theo số liệu cuối cùng tại Bảng tổng hợp chênh lệch.
                    </p>
                  </div>
                  <button
                    type="button"
                    aria-label="Đóng biên bản giải trình"
                    onClick={() => setExplanationModalOpen(false)}
                    className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold"
                  >
                    ×
                  </button>
                </div>

                <div className="overflow-auto flex-1">
                  <table className="w-full min-w-[1050px] text-left text-xs">
                    <thead className="sticky top-0 bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <tr>
                        <th className="p-3">SKU</th>
                        <th className="p-3">Tên hàng hóa</th>
                        <th className="p-3 text-center">Thực tế</th>
                        <th className="p-3 text-center">Sổ sách</th>
                        <th className="p-3 text-center">Chênh lệch</th>
                        <th className="p-3">Giải trình chênh lệch</th>
                        <th className="p-3 min-w-[280px]">Đề xuất xử lý</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {dfMainRows.filter(row => row.diff !== 0).map(row => (
                        <tr key={row.sku} className="align-top hover:bg-slate-50">
                          <td className="p-3 font-mono font-semibold text-slate-800">{row.sku}</td>
                          <td className="p-3 max-w-xs">{row.name}</td>
                          <td className="p-3 text-center font-semibold">{row.totalActual}</td>
                          <td className="p-3 text-center font-semibold">{row.qtySys}</td>
                          <td className={`p-3 text-center font-extrabold ${row.diff < 0 ? 'text-rose-600' : 'text-orange-600'}`}>
                            {row.diff > 0 ? `+${row.diff}` : row.diff}
                          </td>
                          <td className="p-3 text-slate-600 italic max-w-sm">{row.note || "—"}</td>
                          <td className="p-2">
                            <textarea
                              rows="2"
                              value={proposedActions[row.sku] || ""}
                              onChange={event => setProposedActions(previous => ({
                                ...previous,
                                [row.sku]: event.target.value
                              }))}
                              placeholder="Nhập hướng xử lý đề xuất..."
                              aria-label={`Đề xuất xử lý cho SKU ${row.sku}`}
                              className="w-full resize-y rounded-lg border border-slate-300 px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400"
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-4">
                  <p className="text-xs text-slate-500">
                    {dfMainRows.filter(row => row.diff !== 0).length} SKU chênh lệch sẽ được xuất ra file Excel.
                  </p>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setExplanationModalOpen(false)}
                      className="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold"
                    >
                      Hủy
                    </button>
                    <button
                      type="button"
                      onClick={handleExportExplanationExcel}
                      className="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold shadow-sm"
                    >
                      📥 Tải file biên bản giải trình
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {accountPanelOpen && !legacyMode && (
            <AccountManagementPanel callerRole={profile?.role} onClose={() => { setAccountPanelOpen(false); fetchRecountCounters(); }} />
          )}

          {recountReopenTarget && (
            <div className="fixed inset-0 z-50 bg-slate-900/55 flex items-center justify-center p-4">
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="recount-reopen-title"
                className="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-5 shadow-2xl"
              >
                <div className="flex items-start justify-between gap-4">
                  <div>
                    <h3 id="recount-reopen-title" className="text-base font-extrabold text-slate-800">Mở lại kiểm đếm lần 2</h3>
                    <p className="mt-1 text-xs text-slate-500">Chỉ task đã hoàn tất mới được mở lại. Thao tác sẽ đưa task về trạng thái chưa phân công.</p>
                  </div>
                  <button
                    type="button"
                    aria-label="Đóng cửa sổ mở lại"
                    onClick={() => {
                      setRecountReopenTarget(null);
                      setRecountReopenReason("");
                      setRecountReopenConfirmation("");
                    }}
                    className="h-8 w-8 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200"
                  >
                    ×
                  </button>
                </div>
                <div className="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-3 text-xs">
                  <p><span className="font-bold">SKU:</span> {recountReopenTarget.sku}</p>
                  <p><span className="font-bold">BIN:</span> {recountReopenTarget.stock_bin || "—"}</p>
                  <p><span className="font-bold">Người đã kiểm:</span> {recountReopenTarget.assigned_name_snapshot || "—"}</p>
                </div>
                <label htmlFor="recount-reopen-reason" className="mt-4 block text-xs font-bold text-slate-700">Lý do mở lại <span className="text-rose-600">*</span></label>
                <textarea
                  id="recount-reopen-reason"
                  rows="3"
                  value={recountReopenReason}
                  onChange={e => setRecountReopenReason(e.target.value)}
                  placeholder="Nhập lý do mở lại..."
                  className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                <label htmlFor="recount-reopen-confirmation" className="mt-4 block text-xs font-bold text-slate-700">Nhập MO LAI để xác nhận</label>
                <input
                  id="recount-reopen-confirmation"
                  value={recountReopenConfirmation}
                  onChange={e => setRecountReopenConfirmation(e.target.value.toUpperCase())}
                  placeholder="MO LAI"
                  className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm uppercase focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                <div className="mt-4 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setRecountReopenTarget(null);
                      setRecountReopenReason("");
                      setRecountReopenConfirmation("");
                    }}
                    className="rounded-lg bg-slate-100 px-4 py-2 text-xs font-bold text-slate-700 hover:bg-slate-200"
                  >
                    Hủy
                  </button>
                  <button
                    type="button"
                    onClick={confirmReopenRecount}
                    disabled={recountLoading || recountReopenTarget.state !== "completed" || recountReopenConfirmation !== "MO LAI" || !recountReopenReason.trim()}
                    className="rounded-lg bg-rose-600 px-4 py-2 text-xs font-bold text-white hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-slate-300"
                  >
                    {recountLoading ? "⏳ Đang mở lại…" : "Xác nhận mở lại"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {pendingClearSerial && (
            <div className="fixed inset-0 z-50 bg-slate-900/55 flex items-center justify-center p-4">
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="remove-serial-title"
                className="w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-slate-200 p-5"
              >
                <h3 id="remove-serial-title" className="text-base font-extrabold text-slate-800">
                  {pendingClearSerial.removalKind === "wrong" ? "Xóa Serial bắn sai" : "Loại bỏ Serial dư"}
                </h3>
                <div className="mt-3 rounded-xl bg-slate-50 border border-slate-200 p-3 text-xs space-y-1">
                  <p><span className="font-bold">SKU:</span> {pendingClearSerial.sku}</p>
                  <p><span className="font-bold">Serial sổ sách:</span> {pendingClearSerial.stockSerial || "—"}</p>
                  <p><span className="font-bold">Serial đã quét:</span> {pendingClearSerial.serial || "—"}</p>
                </div>
                <label htmlFor="remove-serial-reason" className="block mt-4 text-xs font-bold text-slate-700">
                  Lý do xóa <span className="text-rose-600">*</span>
                </label>
                <textarea
                  id="remove-serial-reason"
                  autoFocus
                  rows="3"
                  value={clearReasonInput}
                  onChange={e => setClearReasonInput(e.target.value)}
                  placeholder="Nhập lý do bắt buộc..."
                  className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                <div className="mt-4 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setPendingClearSerial(null);
                      setClearReasonInput("");
                    }}
                    className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
                  >
                    Hủy
                  </button>
                  <button
                    type="button"
                    onClick={confirmClearSurplusSerial}
                    disabled={!clearReasonInput.trim()}
                    className="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-xs font-bold"
                  >
                    Xác nhận xóa
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const {
        session,
        profile,
        loading,
        error,
        legacyMode,
        profileMissing,
        recovery,
        retry,
        completeRecovery
      } = useAuthState();

      if (loading) {
        return (
          <AuthCard>
            <h1 className="text-lg font-bold text-slate-900">Đang tải tài khoản…</h1>
            <p className="mt-2 text-sm text-slate-500">Hệ thống đang xác minh phiên đăng nhập và quyền truy cập.</p>
          </AuthCard>
        );
      }

      if (recovery) {
        return <UpdatePasswordForm onComplete={completeRecovery} />;
      }

      if (error) {
        return <AuthErrorScreen message={error} onRetry={retry} />;
      }

      if (!session) {
        return <AuthForm />;
      }

      if (legacyMode) {
        return <ApplicationShell session={session} profile={null} legacyMode={true} />;
      }

      if (profileMissing || !profile) {
        return (
          <AccountStateScreen
            title="Không tìm thấy hồ sơ tài khoản"
            description="Tài khoản chưa có hồ sơ truy cập hợp lệ. Hãy thử lại hoặc liên hệ quản trị viên."
            profile={{ email: session.user?.email }}
            onRetry={retry}
          />
        );
      }

      if (profile.status === "pending") {
        return (
          <AccountStateScreen
            title="Chờ phê duyệt"
            description="Tài khoản đã đăng ký thành công và đang chờ quản lý phê duyệt."
            profile={profile}
          />
        );
      }

      if (profile.status === "locked" || profile.status === "deleted") {
        return (
          <AccountStateScreen
            title="Quyền truy cập đã bị vô hiệu hóa"
            description="Tài khoản này đã bị khóa hoặc xóa. Vui lòng liên hệ quản trị viên."
            profile={profile}
          />
        );
      }

      const allowedRole = profile.role === "counter" || profile.role === "manager" || profile.role === "admin";
      if (profile.status !== "active" || !allowedRole) {
        return (
          <AccountStateScreen
            title="Quyền truy cập đã bị vô hiệu hóa"
            description="Trạng thái hoặc vai trò tài khoản không hợp lệ. Vui lòng liên hệ quản trị viên."
            profile={profile}
          />
        );
      }

      return <ApplicationShell session={session} profile={profile} />;
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
