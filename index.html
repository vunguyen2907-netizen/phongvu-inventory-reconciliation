<body class="min-h-screen bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- CANDIDATES SEARCH ---
    const skuCandidates = ['mã sản phẩm', 'mã hàng hóa', 'mã hàng', 'mã sp', 'mã hh', 'mã vật tư', 'mã vt', 'mã thiết bị', 'sku', 'item code', 'product code', 'part number', 'mã'];
    const nameCandidates = ['tên sản phẩm', 'tên hàng hóa', 'tên hàng', 'tên sp', 'tên hh', 'tên vật tư', 'tên thiết bị', 'description', 'product name', 'item name', 'tên'];
    const uomCandidates = ['đơn vị tính', 'đvt', 'uom', 'unit', 'đơn vị'];
    const qtyCandidates = ['số lượng kiểm đếm', 'thực tế đếm', 'số lượng thực tế', 'sl kiểm đếm', 'thực tế đã đếm', 'sl thực tế', 'số lượng sổ sách', 'tồn cuối', 'số lượng tồn', 'tồn kho', 'tồn sổ sách', 'sl sổ sách', 'sl tồn', 'tồn cuối kỳ', 'số lượng', 'tồn', 'sl', 'đã đếm'];
    const serialCandidates = ['số serial', 'serial/lot', 'serial đã quét', 'serial đã kiểm', 'mã serial', 'số seri', 'serial no', 'seri no', 'serial', 'imei', 'sn', 'barcode'];
    const partCandidates = ['part number', 'part_number', 'mã part', 'part no', 'part', 'mã phụ tùng'];
    const binCandidates = ['bin kiểm đếm', 'mã bin', 'tên bin', 'bin', 'vị trí', 'khu vực', 'kệ', 'ô kiểm đếm'];
    const typeCandidates = ['loại hàng', 'loại serial', 'loại', 'hàng hóa', 'phân loại'];
    const performerCandidates = ['người thực hiện', 'người kiểm kê', 'nhân viên kiểm kê', 'nhân viên', 'username', 'user name', 'created by', 'người tạo'];
    const inventoryTimeCandidates = ['thời gian kiểm kê', 'thời gian thực hiện', 'ngày giờ kiểm kê', 'giờ kiểm kê', 'ngày cập nhật', 'ngày giờ cập nhật', 'thời gian', 'updated at', 'updated_at', 'created at', 'created_at'];

    // --- EXECUTION METADATA HELPERS ---
    function formatSingleInventoryTime(text) {
      const s = String(text ?? "").trim();
      if (!s) return "";

      const formulaMatch = s.match(/=?\s*([0-9]+(?:\.[0-9]+)?)\s*(?:\+\s*TIME\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\))?/i);
      if (formulaMatch && (s.startsWith("=") || s.includes("+") || /TIME/i.test(s))) {
        const baseNum = parseFloat(formulaMatch[1]);
        const addH = parseInt(formulaMatch[2] || "0", 10) || 0;
        const addM = parseInt(formulaMatch[3] || "0", 10) || 0;
        const addS = parseInt(formulaMatch[4] || "0", 10) || 0;
        const dayFraction = (((baseNum % 1) + 1) % 1) + (addH / 24) + (addM / 1440) + (addS / 86400);
        const normFrac = ((dayFraction % 1) + 1) % 1;
        const totalSeconds = Math.min(86399, Math.max(0, Math.round(normFrac * 24 * 60 * 60)));
        const totalMinutes = Math.floor(totalSeconds / 60);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
      }

      const clockMatch = s.match(/(?:^|[\sT])(\d{1,2}):(\d{2})(?::\d{2})?/);
      if (clockMatch) {
        return `${String(Number(clockMatch[1])).padStart(2, "0")}:${clockMatch[2]}`;
      }

      const vietnameseClockMatch = s.match(/(?:^|\s)(\d{1,2})h(\d{2})(?:\s|$)/i);
      if (vietnameseClockMatch) {
        return `${String(Number(vietnameseClockMatch[1])).padStart(2, "0")}:${vietnameseClockMatch[2]}`;
      }

      const numericValue = Number(s.replace(",", "."));
      if (Number.isFinite(numericValue)) {
        const dayFraction = ((numericValue % 1) + 1) % 1;
        const totalSeconds = Math.min(86399, Math.max(0, Math.round(dayFraction * 24 * 60 * 60)));
        const totalMinutes = Math.floor(totalSeconds / 60);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
      }

      return s;
    }

    function formatInventoryTime(value) {
      const text = String(value ?? "").trim();
      if (!text) return "";

      const formulaRegex = /=?\s*[0-9]+(?:\.[0-9]+)?\s*(?:\+\s*TIME\s*\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\))?/gi;
      const formulas = text.match(formulaRegex);
      if (formulas && formulas.length > 0 && (text.startsWith("=") || text.includes("+") || /TIME/i.test(text))) {
        const formatted = formulas.map(f => formatSingleInventoryTime(f)).filter(Boolean);
        if (formatted.length > 0) return [...new Set(formatted)].join(", ");
      }

      if (text.includes(",") && !/^\d+,\d+$/.test(text)) {
        const parts = text.split(/\s*,\s*/).map(p => formatSingleInventoryTime(p)).filter(Boolean);
        if (parts.length > 0) return [...new Set(parts)].join(", ");
      }

      return formatSingleInventoryTime(text);
    }

    function summarizeExecutionMetadata(items) {
      const performers = [];
      const times = [];
      const performerKeys = new Set();
      const timeKeys = new Set();

      (items || []).forEach(item => {
        const performer = String(item?.performedBy ?? "").trim();
        const inventoryTime = formatInventoryTime(item?.inventoryTime);
        const performerKey = performer.toLocaleLowerCase("vi");

        if (performer && !performerKeys.has(performerKey)) {
          performerKeys.add(performerKey);
          performers.push(performer);
        }
        if (inventoryTime && !timeKeys.has(inventoryTime)) {
          timeKeys.add(inventoryTime);
          times.push(inventoryTime);
        }
      });

      return {
        performedBy: performers.join(", "),
        inventoryTime: times.join(", ")
      };
    }

    function normalizeExecutionMetadataKey(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .replace(/\s+/g, "")
        .toLocaleLowerCase("vi");
    }

    function buildExecutionMetadataIndex(items) {
      const bySerial = new Map();
      const bySku = new Map();

      (items || []).forEach(item => {
        const skuKey = normalizeExecutionMetadataKey(item?.sku);
        const serialKey = normalizeExecutionMetadataKey(item?.serial);
        if (skuKey) {
          if (!bySku.has(skuKey)) bySku.set(skuKey, []);
          bySku.get(skuKey).push(item);
        }
        if (serialKey) {
          if (!bySerial.has(serialKey)) bySerial.set(serialKey, []);
          bySerial.get(serialKey).push(item);
        }
      });

      return { bySerial, bySku };
    }

    function resolveExecutionMetadata(index, row) {
      if (!index) return { performedBy: "", inventoryTime: "" };

      const serialKeys = [row?.scannedSerial, row?.stockSerial]
        .map(normalizeExecutionMetadataKey)
        .filter(Boolean);

      for (const serialKey of serialKeys) {
        const serialItems = index.bySerial?.get(serialKey);
        if (serialItems?.length) return summarizeExecutionMetadata(serialItems);
      }

      // A missing serial has no counted Serial/LOT to join against. In that case,
      // show every executor/time recorded for the same SKU, as requested for Tab 2.
      const skuKey = normalizeExecutionMetadataKey(row?.sku);
      const skuItems = index.bySku?.get(skuKey);
      if (skuItems?.length) return summarizeExecutionMetadata(skuItems);

      return { performedBy: "", inventoryTime: "" };
    }
    // --- END EXECUTION METADATA HELPERS ---

    function normalizedText(value) {
      return String(value ?? "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function normalizeSku(value) {
      const text = String(value ?? "").trim();
      return text.endsWith(".0") && /^\d+\.0$/.test(text) ? text.slice(0, -2) : text;
    }

    function parseQuantity(value, defaultVal = 0) {
      if (typeof value === "number") return Number.isFinite(value) ? value : defaultVal;
      let text = String(value ?? "").trim().replace(/\s/g, "");
      if (!text) return defaultVal;
      if (text.includes(",") && text.includes(".")) {
        text = text.lastIndexOf(",") > text.lastIndexOf(".")
          ? text.replace(/\./g, "").replace(",", ".")
          : text.replace(/,/g, "");
      } else if (text.includes(",")) {
        text = text.replace(",", ".");
      }
      const number = Number(text);
      return Number.isFinite(number) ? number : defaultVal;
    }

    function findVal(row, candidates, defaultVal = "", excludeList = []) {
      if (!row) return defaultVal;
      const keys = Object.keys(row);
      const eligibleKeys = keys.filter(key => {
        const cleanKey = normalizedText(key);
        return !['stt', 'stt.', 'no', 'no.'].includes(cleanKey)
          && !excludeList.some(ex => cleanKey.includes(normalizedText(ex)));
      });
      // Ưu tiên khớp chính xác để tránh lấy nhầm các cột có tên gần giống.
      for (const cand of candidates) {
        for (const key of eligibleKeys) {
          if (normalizedText(key) === normalizedText(cand)) {
            const val = row[key];
            if (val !== undefined && val !== null && String(val).trim() !== "") {
              return String(val).trim();
            }
          }
        }
      }
      for (const cand of candidates) {
        for (const key of eligibleKeys) {
          if (normalizedText(key).includes(normalizedText(cand))) {
            const val = row[key];
            if (val !== undefined && val !== null && String(val).trim() !== "") return String(val).trim();
          }
        }
      }
      return defaultVal;
    }

    function sortRows(rows, sortConfig) {
      if (!sortConfig.key) return rows;
      const direction = sortConfig.direction === "asc" ? 1 : -1;
      return [...rows].sort((a, b) => {
        const av = a[sortConfig.key];
        const bv = b[sortConfig.key];
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * direction;
        return String(av ?? "").localeCompare(String(bv ?? ""), "vi", {
          numeric: true,
          sensitivity: "base"
        }) * direction;
      });
    }

    function compactSerialAudit(note) {
      const audits = String(note || "").match(/\[Sửa Serial:[^\]]*\]/g) || [];
      const baseNote = String(note || "").replace(/\s*\[Sửa Serial:[^\]]*\]/g, "").trim();
      return [baseNote, audits.at(-1)].filter(Boolean).join(" ");
    }

    function dedupeReportNotes(...values) {
      const seen = new Set();
      const notes = [];
      values.flatMap(value => String(value || "").split("|")).forEach(value => {
        const note = value.replace(/\s+/g, " ").trim();
        if (!note) return;
        const key = normalizedText(note);
        if (seen.has(key)) return;
        seen.add(key);
        notes.push(note);
      });
      return notes.join(" | ");
    }

    function serialsMatch(stockSerial, scannedSerial) {
      const expected = normalizedText(stockSerial);
      const actual = normalizedText(scannedSerial);
      return Boolean(expected && actual && expected === actual);
    }

    async function decodeStoredRows(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value;
      if (typeof value === "object") {
        if (!Array.isArray(value.data)) return [];
        if (Array.isArray(value.columns)) {
          return value.data.map(row => Object.fromEntries(
            value.columns.map((column, index) => [column, row[index]])
          ));
        }
        return value.data;
      }
      if (typeof value === "string") {
        try {
          const bytes = Uint8Array.from(atob(value), char => char.charCodeAt(0));
          const jsonText = window.pako.inflate(bytes, { to: "string" });
          return decodeStoredRows(JSON.parse(jsonText));
        } catch (error) {
          console.error("Không thể giải mã dữ liệu session cũ:", error);
          return [];
        }
      }
      return [];
    }
    window.InventoryCompat = { decodeStoredRows };

    function adaptLegacyDetailRow(row) {
      if (row && row.sku !== undefined) {
        const stockSerial = String(row.stockSerial ?? "");
        const type = String(row.type ?? "Hàng bán");
        const note = String(row.note ?? "");
        return {
          ...row,
          sku: normalizeSku(row.sku),
          name: String(row.name ?? "Chưa có tên"),
          part: String(row.part ?? ""),
          uom: String(row.uom ?? "Cái"),
          qty: parseQuantity(row.qty, 0),
          stockSerial,
          scannedSerial: String(row.scannedSerial ?? ""),
          bin: String(row.bin ?? ""),
          type,
          performedBy: String(row.performedBy ?? ""),
          inventoryTime: String(row.inventoryTime ?? ""),
          checked: parseQuantity(row.checked, 0),
          diff: parseQuantity(row.diff, 0),
          status: String(row.status ?? "Chưa phân loại"),
          note,
          isNonSerial: Boolean(row.isNonSerial)
            || stockSerial.includes("Hàng không serial")
            || type === "Hàng không serial"
        };
      }
      const stockSerial = findVal(row, ['số serial'], "");
      const type = findVal(row, ['loại hàng'], "Hàng bán");
      const isNonSerial = stockSerial.includes("Hàng không serial") || type === "Hàng không serial";
      const note = findVal(row, ['note đơn hàng'], "");
      return {
        sku: normalizeSku(findVal(row, skuCandidates)),
        name: findVal(row, nameCandidates, "Chưa có tên"),
        part: findVal(row, partCandidates, ""),
        uom: findVal(row, uomCandidates, "Cái"),
        qty: parseQuantity(findVal(row, ['số lượng'], isNonSerial ? "0" : "1"), isNonSerial ? 0 : 1),
        stockSerial,
        scannedSerial: findVal(row, ['serial đã quét'], ""),
        bin: findVal(row, binCandidates, ""),
        type,
        performedBy: findVal(row, performerCandidates, ""),
        inventoryTime: findVal(row, inventoryTimeCandidates, ""),
        checked: parseQuantity(findVal(row, ['đã kiểm'], "0"), 0),
        diff: parseQuantity(findVal(row, ['dư/thiếu'], "0"), 0),
        status: findVal(row, ['check đơn'], "Chưa phân loại"),
        note,
        isNonSerial
      };
    }

    function adaptLegacyCountRow(row) {
      if (row && row.sku !== undefined) {
        const qtySys = parseQuantity(row.qtySys, 0);
        const qtyL1 = parseQuantity(row.qtyL1, 0);
        const qtyL2 = parseQuantity(row.qtyL2, 0);
        const totalActual = parseQuantity(row.totalActual, qtyL1 + qtyL2);
        return {
          ...row,
          sku: normalizeSku(row.sku),
          name: String(row.name ?? "Chưa có tên"),
          uom: String(row.uom ?? "Cái"),
          qtySys,
          qtyL1,
          qtyL2,
          totalActual,
          diffL2: parseQuantity(row.diffL2, totalActual - qtySys),
          note: String(row.note ?? "")
        };
      }
      const qtySys = parseQuantity(findVal(row, ['số lượng sổ sách (hệ thống)'], "0"), 0);
      const qtyL1 = parseQuantity(findVal(row, ['số liệu thực tế đã đếm lần 1'], "0"), 0);
      const qtyL2 = parseQuantity(findVal(row, ['số liệu thực tế đếm lại lần 2'], "0"), 0);
      const totalActual = parseQuantity(
        findVal(row, ['kết quả xử lý sau khi đếm lại lần 2'], String(qtyL1 + qtyL2)),
        qtyL1 + qtyL2
      );
      return {
        sku: normalizeSku(findVal(row, ['mã vật tư', ...skuCandidates])),
        name: findVal(row, ['tên vật tư', ...nameCandidates], "Chưa có tên"),
        uom: findVal(row, ['đvt', ...uomCandidates], "Cái"),
        qtySys,
        qtyL1,
        qtyL2,
        totalActual,
        diffL2: totalActual - qtySys,
        note: findVal(row, ['note mã đơn'], "")
      };
    }

    function normalizeDetailRows(rows) {
      return (Array.isArray(rows) ? rows : []).map((sourceRow, index) => {
        const row = adaptLegacyDetailRow(sourceRow);
        const isResolvedL2 = row.status === "Đã sửa Serial (Lần 2)"
          && serialsMatch(row.stockSerial, row.scannedSerial);
        return {
          ...row,
          status: isResolvedL2 ? "Đã quét đủ" : row.status,
          diff: isResolvedL2 ? 0 : row.diff,
          checked: isResolvedL2 ? 1 : row.checked,
          l2Added: Boolean(row.l2Added)
            || /\[Sửa Serial:\s*trống\s*[→-]/i.test(String(row.note || "")),
          note: compactSerialAudit(row.note),
          rowId: row.rowId || `${row.sku}::${index}`
        };
      });
    }

    function syncCountsWithDetail(countRows, detailRows) {
      const l2BySku = {};
      const hasL2Tracking = new Set();
      detailRows.forEach(row => {
        if (row.l2Added) {
          hasL2Tracking.add(row.sku);
          if (row.checked > 0 && row.status !== "Đã loại bỏ Serial dư") {
            l2BySku[row.sku] = (l2BySku[row.sku] || 0) + 1;
          }
        }
      });
      return (countRows || []).map(row => {
        if (!hasL2Tracking.has(row.sku)) return row;
        const qtyL2 = l2BySku[row.sku] || 0;
        const totalActual = row.qtyL1 + qtyL2;
        return { ...row, qtyL2, totalActual, diffL2: totalActual - row.qtySys };
      });
    }

    function SortableHeader({ label, column, sortConfig, onSort, className = "" }) {
      const active = sortConfig.key === column;
      return (
        <th className={`p-3 select-none ${className}`}>
          <button
            type="button"
            onClick={() => onSort(column)}
            className="w-full flex items-center gap-1 hover:text-brand-600 transition text-left"
            title={`Sắp xếp theo ${label}`}
          >
            <span>{label}</span>
            <span className={`text-[10px] ${active ? "text-brand-600" : "text-slate-300"}`}>
              {active ? (sortConfig.direction === "asc" ? "▲" : "▼") : "⇅"}
            </span>
          </button>
        </th>
      );
    }

    function RecountNoteInput({ initialValue, onSave, placeholder, className, suggestionsId }) {
      const [val, setVal] = useState(initialValue || "");
      useEffect(() => {
        setVal(initialValue || "");
      }, [initialValue]);

      return (
        <input
          type="text"
          list={suggestionsId}
          value={val}
          onChange={e => setVal(e.target.value)}
          onBlur={() => {
            if (val !== (initialValue || "")) {
              onSave(val);
            }
          }}
          onKeyDown={e => {
            if (e.key === "Enter") {
              if (val !== (initialValue || "")) {
                onSave(val);
              }
              e.target.blur();
            }
          }}
          placeholder={placeholder}
          className={className}
        />
      );
    }

    // --- PYTHON-EQUIVALENT MAXIMUM SCORE HEADER DETECTOR ---
    function parseSmartSheet(ws) {
      const rows2d = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      if (!rows2d || rows2d.length === 0) return [];
      
      const headerKeywords = ['mã', 'sku', 'tên', 'tồn', 'số lượng', 'sl', 'serial', 'chênh lệch', 'đvt', 'hàng hóa', 'sản phẩm', 'stt', 'đơn vị', 'part', 'bin'];
      let bestRowIdx = 0;
      let maxScore = -1;
      
      for (let i = 0; i < Math.min(30, rows2d.length); i++) {
        const rowCells = rows2d[i].map(c => String(c).trim()).filter(c => c !== "");
        const rowCellsLower = rowCells.map(c => c.toLowerCase());
        const distinctCells = new Set(rowCellsLower);
        
        if (distinctCells.size < 3) continue;
        
        let score = 0;
        distinctCells.forEach(cell => {
          if (headerKeywords.some(kw => cell.includes(kw))) {
            score++;
          }
        });
        
        if (score > maxScore) {
          maxScore = score;
          bestRowIdx = i;
        }
      }

      const headersRaw = rows2d[bestRowIdx].map(c => String(c).trim());
      const seen = {};
      const cleanHeaders = [];
      
      headersRaw.forEach((h, i) => {
        const base = h || `Unnamed_${i}`;
        if (seen[base] !== undefined) {
          seen[base]++;
          cleanHeaders.push(`${base}_${seen[base]}`);
        } else {
          seen[base] = 0;
          cleanHeaders.push(base);
        }
      });

      const dataRows = [];
      const invalidSkus = ['tổng', 'tổng cộng', 'total', 'nan', 'none', 'null', 'sum', '', 'stt', 'stt.'];

      for (let i = bestRowIdx + 1; i < rows2d.length; i++) {
        const r = rows2d[i];
        if (!r || r.every(cell => String(cell).trim() === "")) continue;
        const obj = {};
        cleanHeaders.forEach((h, colIdx) => {
          if (h) obj[h] = r[colIdx] !== undefined ? r[colIdx] : "";
        });
        
        let skuVal = findVal(obj, skuCandidates);
        
        if (!skuVal) {
          for (const h of cleanHeaders) {
            const hLower = h.toLowerCase();
            if (hLower === 'stt' || hLower === 'stt.' || hLower === 'no') continue;
            const val = String(obj[h] || '').trim();
            if (val && !invalidSkus.includes(val.toLowerCase())) {
              skuVal = val;
              break;
            }
          }
        }

        if (skuVal && !invalidSkus.includes(skuVal.toLowerCase())) {
          dataRows.push(obj);
        }
      }
      
      return dataRows;
    }

    function readWorkbookSmart(arrayBuffer, isErp = false) {
      const data = new Uint8Array(arrayBuffer);
      const wb = XLSX.read(data, { type: 'array' });
      
      if (isErp) {
        const targetSheetName = wb.SheetNames.find(s => {
          const sLower = s.toLowerCase();
          return sLower.includes('ketquachitiet') || sLower.includes('chitiet') || sLower.includes('detail');
        }) || (wb.SheetNames.length > 1 ? wb.SheetNames[1] : wb.SheetNames[0]);
        
        if (targetSheetName && wb.Sheets[targetSheetName]) {
          const rows = parseSmartSheet(wb.Sheets[targetSheetName]);
          if (rows.length > 0) return rows;
        }
      }

      for (const sheetName of wb.SheetNames) {
        const ws = wb.Sheets[sheetName];
        const rows = parseSmartSheet(ws);
        if (rows.length > 0) {
          return rows;
        }
      }
      return [];
    }

    // --- LOCAL DRAFT PERSISTENCE (Chống mất dữ liệu khi reload / chụp màn hình) ---
    const DRAFT_DB_NAME = "PV_Inventory_DB";
    const DRAFT_STORE_NAME = "inventory_draft";
    const DRAFT_KEY = "current_active_draft";

    function encodePakoData(data) {
      if (!data) return "";
      try {
        const jsonStr = JSON.stringify(data);
        if (!window.pako) return jsonStr;
        const compressed = window.pako.deflate(jsonStr);
        let binary = "";
        const len = compressed.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(compressed[i]);
        }
        return btoa(binary);
      } catch (_e) {
        return "";
      }
    }

    function decodePakoData(str) {
      if (!str) return null;
      try {
        if (str.startsWith("[") || str.startsWith("{")) return JSON.parse(str);
        const binary = atob(str);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const jsonStr = window.pako.inflate(bytes, { to: "string" });
        return JSON.parse(jsonStr);
      } catch (_e) {
        return null;
      }
    }

    function saveSyncLocalStorage(data) {
      if (!data) return;
      try {
        if (data.activeTab) localStorage.setItem("PV_ACTIVE_TAB", data.activeTab);
        if (data.activeSessionId !== undefined) localStorage.setItem("PV_ACTIVE_SESSION_ID", data.activeSessionId || "");
        if (data.sessionName) localStorage.setItem("PV_ACTIVE_SESSION_NAME", data.sessionName);
        if (data.lastSavedTime) localStorage.setItem("PV_LAST_SAVED_TIME", data.lastSavedTime || "");
        if (data.rawStockFileName) localStorage.setItem("PV_STOCK_FILE_NAME", data.rawStockFileName);
        if (data.rawErpFileName) localStorage.setItem("PV_ERP_FILE_NAME", data.rawErpFileName);
        if (data.filterDetailStatus) localStorage.setItem("PV_FILTER_DETAIL", data.filterDetailStatus);

        // Lưu nén đồng bộ rows
        if (data.dfCheckDetail && data.dfCheckDetail.length > 0) {
          const encodedDetail = encodePakoData(data.dfCheckDetail);
          if (encodedDetail) localStorage.setItem("PV_SYNC_DETAIL", encodedDetail);
        }
        if (data.dfCountL2 && data.dfCountL2.length > 0) {
          const encodedL2 = encodePakoData(data.dfCountL2);
          if (encodedL2) localStorage.setItem("PV_SYNC_COUNT_L2", encodedL2);
        }
      } catch (e) {
        console.warn("Sync localStorage save warning:", e);
      }
    }

    function readSyncLocalStorage() {
      try {
        const detailRaw = localStorage.getItem("PV_SYNC_DETAIL");
        const countL2Raw = localStorage.getItem("PV_SYNC_COUNT_L2");
        const dfCheckDetail = decodePakoData(detailRaw) || [];
        const dfCountL2 = decodePakoData(countL2Raw) || [];
        return {
          activeTab: localStorage.getItem("PV_ACTIVE_TAB") || null,
          activeSessionId: localStorage.getItem("PV_ACTIVE_SESSION_ID") || null,
          sessionName: localStorage.getItem("PV_ACTIVE_SESSION_NAME") || null,
          lastSavedTime: localStorage.getItem("PV_LAST_SAVED_TIME") || null,
          rawStockFileName: localStorage.getItem("PV_STOCK_FILE_NAME") || "",
          rawErpFileName: localStorage.getItem("PV_ERP_FILE_NAME") || "",
          filterDetailStatus: localStorage.getItem("PV_FILTER_DETAIL") || null,
          dfCheckDetail,
          dfCountL2
        };
      } catch (_e) {
        return null;
      }
    }

    function openDraftDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        try {
          const req = window.indexedDB.open(DRAFT_DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(DRAFT_STORE_NAME)) {
              db.createObjectStore(DRAFT_STORE_NAME);
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = () => resolve(null);
        } catch (_err) {
          resolve(null);
        }
      });
    }

    async function saveLocalDraft(data) {
      if (!data) return;
      saveSyncLocalStorage(data);
      try {
        const db = await openDraftDB();
        if (db) {
          const tx = db.transaction(DRAFT_STORE_NAME, "readwrite");
          tx.objectStore(DRAFT_STORE_NAME).put(data, DRAFT_KEY);
        }
      } catch (e) {
        console.warn("IndexedDB save draft failed:", e);
      }
      try {
        const meta = {
          activeTab: data.activeTab,
          activeSessionId: data.activeSessionId,
          sessionName: data.sessionName,
          lastSavedTime: data.lastSavedTime,
          rawStockFileName: data.rawStockFileName,
          rawErpFileName: data.rawErpFileName,
          hasDetails: Boolean(data.dfCheckDetail && data.dfCheckDetail.length > 0),
          savedAt: Date.now()
        };
        localStorage.setItem("PV_INVENTORY_DRAFT_META", JSON.stringify(meta));
      } catch (_e) {}
    }

    async function loadLocalDraft() {
      // Ưu tiên đọc đồng bộ từ localStorage trước
      const syncData = readSyncLocalStorage();
      if (syncData && syncData.dfCheckDetail && syncData.dfCheckDetail.length > 0) {
        return syncData;
      }
      try {
        const db = await openDraftDB();
        if (db) {
          const draft = await new Promise((resolve) => {
            try {
              const tx = db.transaction(DRAFT_STORE_NAME, "readonly");
              const req = tx.objectStore(DRAFT_STORE_NAME).get(DRAFT_KEY);
              req.onsuccess = () => resolve(req.result || null);
              req.onerror = () => resolve(null);
            } catch (_err) {
              resolve(null);
            }
          });
          if (draft && draft.dfCheckDetail && draft.dfCheckDetail.length > 0) {
            return draft;
          }
        }
      } catch (e) {
        console.warn("IndexedDB load draft failed:", e);
      }
      return null;
    }

    async function clearLocalDraft() {
      try {
        const db = await openDraftDB();
        if (db) {
          const tx = db.transaction(DRAFT_STORE_NAME, "readwrite");
          tx.objectStore(DRAFT_STORE_NAME).delete(DRAFT_KEY);
        }
      } catch (_e) {}
      try {
        localStorage.removeItem("PV_INVENTORY_DRAFT_META");
        localStorage.removeItem("PV_SYNC_DETAIL");
        localStorage.removeItem("PV_SYNC_COUNT_L2");
        localStorage.removeItem("PV_ACTIVE_TAB");
        localStorage.removeItem("PV_ACTIVE_SESSION_ID");
        localStorage.removeItem("PV_ACTIVE_SESSION_NAME");
        localStorage.removeItem("PV_LAST_SAVED_TIME");
        localStorage.removeItem("PV_STOCK_FILE_NAME");
        localStorage.removeItem("PV_ERP_FILE_NAME");
        localStorage.removeItem("PV_FILTER_DETAIL");
      } catch (_e) {}
    }

    // --- SUPABASE CONFIG ---
    const getSupabaseConfig = () => {
      let url = window.SUPABASE_URL || localStorage.getItem('SUPABASE_URL') || '';
      // Chỉ nhận publishable/anon key ở trình duyệt; không đọc service-role key cũ.
      let key = window.SUPABASE_KEY || localStorage.getItem('SUPABASE_PUBLISHABLE_KEY') || '';
      return { url, key };
    };

    const AUTH_LOCATION_MESSAGE = "inventory-auth-location";
    const authLocationSubscribers = new Set();
    let pendingAuthLocation = null;

    function queueAuthLocation(payload) {
      pendingAuthLocation = payload;
      authLocationSubscribers.forEach(subscriber => subscriber(payload));
    }

    function subscribeAuthLocation(subscriber) {
      authLocationSubscribers.add(subscriber);
      return () => authLocationSubscribers.delete(subscriber);
    }

    function recoveryLocationFromPayload(payload) {
      if (!payload || payload.type !== AUTH_LOCATION_MESSAGE) return null;
      try {
        const url = new URL(String(payload.href || ""), getAuthRedirectUrl());
        const configured = new URL(getAuthRedirectUrl());
        if (url.origin !== configured.origin) return null;
        const hash = new URLSearchParams(url.hash.replace(/^#/, ""));
        const isRecovery = hash.get("type") === "recovery"
          || url.searchParams.get("type") === "recovery"
          || url.searchParams.get("auth_recovery") === "1";
        if (!isRecovery) return null;
        return { href: url.toString(), hash, search: url.searchParams };
      } catch (_error) {
        return null;
      }
    }

    window.addEventListener("message", event => {
      if (window.parent === window || event.source !== window.parent) return;
      const recoveryLocation = recoveryLocationFromPayload(event.data);
      if (recoveryLocation) queueAuthLocation(recoveryLocation);
    });

    try {
      const directLocation = recoveryLocationFromPayload({
        type: AUTH_LOCATION_MESSAGE,
        href: window.location.href
      });
      if (directLocation) queueAuthLocation(directLocation);
    } catch (_error) {}

    if (window.parent !== window) {
      window.parent.postMessage({ type: "inventory-auth-bridge-ready" }, "*");
    }

    let supabaseClient = null;
    let supabaseReady = Promise.resolve(null);
    const initSupabase = () => {
      const { url, key } = getSupabaseConfig();
      if (url && key) {
        try {
          supabaseClient = supabase.createClient(url, key, {
            auth: { detectSessionInUrl: false }
          });
          supabaseReady = Promise.resolve(supabaseClient);
        } catch (e) { console.error("Supabase init error:", e); }
      }
    };
    initSupabase();

    async function getReadySupabaseClient() {
      return supabaseReady;
    }

    const MANAGER_TABS = Object.freeze([
      { id: "import", label: "1. Nhập dữ liệu" },
      { id: "serial-detail", label: "2. Chi tiết Serial" },
      { id: "second-count", label: "3. Kiểm đếm lần 2" },
      { id: "variance-summary", label: "4. Bảng tổng hợp chênh lệch" },
      { id: "export", label: "5. Xuất báo cáo" },
      { id: "monthly-archive", label: "6. Lưu trữ hàng tháng" }
    ]);
    const COUNTER_TABS = Object.freeze([
      { id: "second-count", label: "Kiểm đếm lần 2" }
    ]);

    function getAuthRedirectUrl() {
      const configured = String(window.AUTH_REDIRECT_URL || "").trim();
      const candidates = [configured, document.referrer];
      for (const candidate of candidates) {
        if (!candidate) continue;
        try {
          const url = new URL(candidate, window.location.origin);
          if (url.protocol === "https:" || url.protocol === "http:") {
            url.hash = "";
            return url.toString();
          }
        } catch (_error) {}
      }
      return window.location.origin;
    }

    function getPasswordRecoveryRedirectUrl() {
      // Supabase rejects malformed redirect URLs before sending the email.
      // Always normalize the configured value and fall back to the current
      // app URL when Streamlit has injected an empty or invalid secret.
      const safeOrigin = /^https?:$/.test(window.location.protocol)
        ? window.location.origin
        : "http://localhost";
      let url;
      try {
        url = new URL(getAuthRedirectUrl(), safeOrigin);
        if (url.protocol !== "https:" && url.protocol !== "http:") throw new Error("Unsupported redirect protocol");
      } catch (_error) {
        url = new URL(window.location.pathname || "/", safeOrigin);
      }
      url.searchParams.set("auth_recovery", "1");
      return url.toString();
    }

    function acknowledgeAuthLocation() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "inventory-auth-location-consumed" }, "*");
      }
    }

    function authErrorMessage(error, fallback = "Không thể xác thực tài khoản.") {
      return error?.message || String(error || "").trim() || fallback;
    }

    function useAuthState() {
      const [attempt, setAttempt] = useState(0);
      const [recovery, setRecovery] = useState(false);
      const [authState, setAuthState] = useState({
        session: null,
        profile: null,
        loading: true,
        error: "",
        legacyMode: false,
        profileMissing: false
      });

      useEffect(() => {
        let mounted = true;
        let requestVersion = 0;
        let subscription = null;
        let unsubscribeAuthLocation = () => {};
        let recoveryInProgress = false;
        const scheduledAuthTasks = new Set();
        const handledRecoveryLocations = new Set();
        const legacyEnabled = window.ENABLE_LEGACY_ANONYMOUS === true;

        const invalidateProfileRequests = () => ++requestVersion;

        const setFailure = (error, version = null) => {
          if (!mounted || (version !== null && version !== requestVersion)) return;
          invalidateProfileRequests();
          setAuthState({
            session: null,
            profile: null,
            loading: false,
            error: authErrorMessage(error),
            legacyMode: false,
            profileMissing: false
          });
        };

        const loadAuthoritativeProfile = async (client, session, version) => {
          try {
            if (mounted) {
              setAuthState({ session, profile: null, loading: true, error: "", legacyMode: false, profileMissing: false });
            }

            const { data, error } = await client
              .from("profiles")
              .select("id, email, full_name, erp_name, role, status")
              .eq("id", session.user.id)
              .maybeSingle();
            if (error) throw error;

            if (!mounted || version !== requestVersion) return;
            setAuthState({
              session,
              profile: data,
              loading: false,
              error: "",
              legacyMode: false,
              profileMissing: !data
            });
          } catch (error) {
            setFailure(error, version);
          }
        };

        const acceptSession = async (client, session, acceptedVersion = null) => {
          const version = acceptedVersion === null
            ? invalidateProfileRequests()
            : acceptedVersion;
          if (version !== requestVersion) return;
          recoveryInProgress = false;
          if (mounted) setRecovery(false);

          if (!session) {
            if (!legacyEnabled) {
              if (mounted && version === requestVersion) {
                setAuthState({ session: null, profile: null, loading: false, error: "", legacyMode: false, profileMissing: false });
              }
              return;
            }
            const { data, error } = await client.auth.signInAnonymously();
            if (error) throw error;
            const anonymousSession = data?.session || null;
            if (!anonymousSession) throw new Error("Không thể tạo phiên chuyển đổi.");
            if (mounted && version === requestVersion) {
              setAuthState({ session: anonymousSession, profile: null, loading: false, error: "", legacyMode: true, profileMissing: false });
            }
            return;
          }

          if (session.user?.is_anonymous === true) {
            if (legacyEnabled) {
              if (mounted && version === requestVersion) {
                setAuthState({ session, profile: null, loading: false, error: "", legacyMode: true, profileMissing: false });
              }
              return;
            }
            const { error } = await client.auth.signOut();
            if (error) throw error;
            if (mounted && version === requestVersion) {
              setAuthState({ session: null, profile: null, loading: false, error: "", legacyMode: false, profileMissing: false });
            }
            return;
          }

          if (!session.user?.id) {
            if (mounted && version === requestVersion) {
              setAuthState({ session: null, profile: null, loading: false, error: "", legacyMode: false, profileMissing: false });
            }
            return;
          }

          await loadAuthoritativeProfile(client, session, version);
        };

        const showRecovery = (session) => {
          invalidateProfileRequests();
          recoveryInProgress = true;
          if (!mounted) return;
          setRecovery(true);
          setAuthState({ session, profile: null, loading: false, error: "", legacyMode: false, profileMissing: false });
        };

        const scheduleSessionAcceptance = (client, session, version) => {
          const task = window.setTimeout(() => {
            scheduledAuthTasks.delete(task);
            if (!mounted || version !== requestVersion) return;
            acceptSession(client, session, version)
              .catch(error => setFailure(error, version));
          }, 0);
          scheduledAuthTasks.add(task);
        };

        const processRecoveryLocation = async (client, location) => {
          if (!location || handledRecoveryLocations.has(location.href)) return false;
          handledRecoveryLocations.add(location.href);
          recoveryInProgress = true;

          const accessToken = location.hash.get("access_token");
          const refreshToken = location.hash.get("refresh_token");
          const code = location.search.get("code");
          let result = null;
          if (accessToken && refreshToken) {
            result = await client.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
          } else if (code) {
            result = await client.auth.exchangeCodeForSession(code);
          } else {
            recoveryInProgress = false;
            return false;
          }

          if (result?.error) throw result.error;
          showRecovery(result?.data?.session || null);
          pendingAuthLocation = null;
          acknowledgeAuthLocation();
          return true;
        };

        (async () => {
          try {
            setRecovery(false);
            setAuthState(current => ({ ...current, loading: true, error: "" }));
            const client = await getReadySupabaseClient();
            if (!client) throw new Error("Chưa cấu hình Supabase Auth.");

            const listener = client.auth.onAuthStateChange((event, nextSession) => {
              if (event === "PASSWORD_RECOVERY") {
                showRecovery(nextSession);
                return;
              }
              if (recoveryInProgress && event !== "SIGNED_OUT") return;
              const version = invalidateProfileRequests();
              scheduleSessionAcceptance(client, nextSession, version);
            });
            subscription = listener?.data?.subscription || null;

            const handleRecoveryLocation = (location) => {
              processRecoveryLocation(client, location).catch(error => {
                recoveryInProgress = false;
                setFailure(error);
              });
            };
            unsubscribeAuthLocation = subscribeAuthLocation(handleRecoveryLocation);

            const recovered = pendingAuthLocation
              ? await processRecoveryLocation(client, pendingAuthLocation)
              : false;
            if (!recovered && !recoveryInProgress) {
              const bootstrapVersion = requestVersion;
              const { data, error } = await client.auth.getSession();
              if (error) throw error;
              if (!mounted || bootstrapVersion !== requestVersion) return;
              await acceptSession(client, data?.session || null, bootstrapVersion);
            }
          } catch (error) {
            recoveryInProgress = false;
            setFailure(error);
          }
        })();

        return () => {
          mounted = false;
          invalidateProfileRequests();
          subscription?.unsubscribe();
          unsubscribeAuthLocation();
          scheduledAuthTasks.forEach(task => window.clearTimeout(task));
          scheduledAuthTasks.clear();
        };
      }, [attempt]);

      return {
        ...authState,
        recovery,
        retry: () => setAttempt(value => value + 1),
        completeRecovery: () => {
          setRecovery(false);
          setAttempt(value => value + 1);
        }
      };
    }

    function AuthCard({ children }) {
